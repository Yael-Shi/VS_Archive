[tool.poetry]
name = "vs-archive-infra"
version = "0.1.0"
description = "Infrastructure for VS Archive"
authors = ["vs-archive"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
aws-cdk-lib = "^2.180.0"
constructs = "^10.0.0"

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
ruff = "0.14.14"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [
  "cdk.out/**",
  "**/__pycache__/**",
]

[tool.pyright]
typeCheckingMode = "standard"
exclude = [
  "cdk.out/**",
  "**/__pycache__/**",
]
