[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Yael Shifman",email = "yael.080@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "django (>=6.0.1,<7.0.0)",
    "psycopg[binary] (>=3.3.2,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "boto3 (>=1.42.34,<2.0.0)",
    "pymupdf (>=1.26.7,<2.0.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "google-cloud-vision (>=3.12.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Ignore generated / noisy dirs
exclude = [
  "**/migrations/**",
  "**/__pycache__/**",
]

[tool.ruff.format]
# keep default aggressive formatting (ruff formatter)
# nothing needed here unless you want to tune later

[tool.pyright]
# Medium now, tighten later
typeCheckingMode = "standard"
exclude = [
  "**/migrations/**",
  "**/__pycache__/**",
  "**/.venv",
  "**/venv",
  "**/myenv",
  "**/__pycache__",
  "**/.pytest_cache",
  "**/.mypy_cache",
  "**/.ruff_cache",
  "**/site-packages"
]
# Pyright is not Django-ORM aware; mypy+django-stubs is the source of truth for ORM typing.
reportAttributeAccessIssue = "none"
reportOptionalMemberAccess = "none"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "vs_archive.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]

[dependency-groups]
dev = [
    "ruff (==0.14.14)",
    "pyright (>=1.1.408,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-django (>=4.11.1,<5.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "django-stubs (>=5.2.9,<6.0.0)"
]
