{% extends "base.html" %}
{% block title %}VSArchive - התחברות{% endblock %}

{% block content %}
  <div class="card card--narrow page-header">
    <h1 class="page-title">התחברות</h1>
    <p class="page-subtitle">כדי לצפות בתוכן, יש להתחבר.</p>

    <form method="post" action="">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions form-actions--spaced">
        <button class="btn btn-primary" type="submit">התחברות</button>
        <a class="btn" href="{% url 'public-register' %}">אין לכם חשבון? הרשמה</a>
        <a class="btn" href="/">חזרה לדף הבית</a>
      </div>
    </form>
  </div>
{% endblock %}
