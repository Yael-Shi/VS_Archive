{% extends "base.html" %}

    <p class="page-subtitle" style="margin-top: 8px;">
      העמוד הזה זמין למנהלים בלבד.

    <div class="spacer"></div>

    <div style="display:flex; gap:10px; flex-wrap: wrap;">

      <a class="btn btn-primary" href="/api/ui/documents/">חזרה לרשימת המסמכים</a>
