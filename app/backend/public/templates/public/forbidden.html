{% extends "base.html" %}
{% block title %}VSArchive - אין לך גישה לעמוד הזה{% endblock %}

{% block content %}
  <div class="card card--narrow page-header">
    <h1 class="page-title">אין לך גישה לעמוד הזה</h1>
    <p class="page-subtitle text-readable">
      ייתכן שהעמוד מיועד למנהלי הארכיון בלבד, או שאין לך גישה לצפות בו.
    </p>
    <p class="muted text-readable">
      אם אתם חושבים שזו טעות, פנו לצוות הארכיון.
    </p>

    <div class="form-actions form-actions--spaced">
      <a class="btn btn-primary" href="{% url 'archive-list' %}">חזרה לארכיון</a>
      <a class="btn" href="/">חזרה לדף הבית</a>
    </div>
  </div>
{% endblock %}
