<nav style="display:flex; gap:12px; align-items:center; padding:12px 0;">
  <a href="/" style="text-decoration:none;">Home</a>
  <a href="/about/" style="text-decoration:none;">About</a>

  <span style="flex:1;"></span>

  {% if user.is_authenticated %}
    <a href="/api/ui/documents/" style="text-decoration:none;">Documents</a>
    <a href="/api/ui/upload/" style="text-decoration:none;">Upload</a>
    <form action="/accounts/logout/" method="post" style="display:inline; margin:0; padding:0;">
        {% csrf_token %}
        <button type="submit"
                style="background:none; color:#0000EE; border:none; padding:0; margin:0; cursor:pointer; text-decoration:underline; font: inherit;">
            Logout
        </button>
</form>
  {% else %}
    <a href="/api/ui/documents/" style="text-decoration:none;">Documents</a>
    <a href="/accounts/login/" style="text-decoration:none;">Login</a>
  {% endif %}
</nav>
<hr />
