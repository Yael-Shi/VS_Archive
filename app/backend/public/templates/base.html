<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}VSArchive{% endblock %}</title>
  <style>
    :root{
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #101828;
      --muted: #667085;
      --border: #e5e7eb;
      --shadow: 0 1px 2px rgba(16,24,40,.06);
      --shadow2: 0 10px 25px rgba(16,24,40,.08);
      --primary: #2563eb;
      --primary2: #1d4ed8;
      --danger: #b42318;
      --ok: #067647;
      --warn: #b54708;
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, "Noto Sans Hebrew", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container{
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px 16px 48px;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .page-title{
      margin: 10px 0 6px;
      font-size: 26px;
      letter-spacing: -0.2px;
    }
    .page-subtitle{
      margin: 0 0 12px;
      color: var(--muted);
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      cursor:pointer;
      font: inherit;
      text-decoration:none;
      box-shadow: var(--shadow);
      white-space: nowrap;
    }
    .btn:hover{ filter: brightness(.98); }
    .btn-primary{
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover{ background: var(--primary2); border-color: var(--primary2); }
    .btn-danger{
      background: transparent;
      border-color: transparent;
      color: var(--danger);
      box-shadow: none;
      padding: 8px 8px;
    }
    .btn-link{
      background: transparent;
      border-color: transparent;
      box-shadow:none;
      padding: 8px 8px;
      color: var(--primary);
    }

    .muted{ color: var(--muted); }

    .grid-3{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 900px){
      .grid-3{ grid-template-columns: 1fr; }
    }

    .toolbar{
      display:flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: end;
      margin-top: 10px;
      margin-bottom: 12px;
    }

    .field{
      display:flex;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
    }
    label{ font-weight: 600; font-size: 13px; color: var(--text); }
    input[type="text"], input[type="date"], select, textarea{
      width:100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      background: #fff;
      outline: none;
    }
    textarea{ min-height: 110px; }

    .table{
      width:100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fff;
      box-shadow: var(--shadow);
    }
    .table th, .table td{
      padding: 12px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      text-align: right;
      font-size: 14px;
    }
    .table th{
      background: #f3f4f6;
      font-size: 13px;
      color: #344054;
      font-weight: 700;
    }
    .table tr:last-child td{ border-bottom: none; }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: #344054;
      white-space: nowrap;
    }
    .badge-ok{ border-color: #a6f4c5; background: #ecfdf3; color: var(--ok); }
    .badge-warn{ border-color: #fedf89; background: #fffaeb; color: var(--warn); }
    .badge-bad{ border-color: #fecdca; background: #fef3f2; color: var(--danger); }

    .two-col{
      display:grid;
      grid-template-columns: 1.3fr .9fr;
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 980px){
      .two-col{ grid-template-columns: 1fr; }
    }

    .section-title{
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.1px;
    }
    pre{
      margin: 0;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fbfbfb;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 50vh;
      overflow:auto;
    }

    .viewer img { max-width: 100%; height: auto; border-radius: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .viewer iframe { width: 100%; height: 75vh; border-radius: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); background:#fff; }

    .meta-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px 12px;
      margin-top: 10px;
    }
    @media (max-width: 900px){
      .meta-grid{ grid-template-columns: 1fr; }
    }
    .meta-item{
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
    }
    .meta-item .k{ font-size: 12px; color: var(--muted); font-weight: 700; }
    .meta-item .v{ font-size: 14px; margin-top: 2px; }

    .spacer{ height: 10px; }

    /* Make buttons in forms look like links (used for logout) */
    .nav-btn{
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      font: inherit;
      color: var(--primary);
      text-decoration: none;
    }
    .nav-btn:hover{ text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    {% include "partials/nav.html" %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
