<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}VSArchive{% endblock %}</title>
  <style>
    :root{
      --bg: #f5f4f1;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 1px 2px rgba(15, 23, 42, .06);
      --shadow2: 0 10px 24px rgba(15, 23, 42, .07);
      --primary: #355c9b;
      --primary2: #2f4f86;
      --danger: #b42318;
      --ok: #067647;
      --warn: #b54708;
      --radius: 16px;
      --focus-ring: 0 0 0 3px rgba(53, 92, 155, .2);
    }

    * { box-sizing: border-box; }
    body{
      margin:0;
      font-family: "Noto Sans Hebrew", "Segoe UI", "Arial Hebrew", system-ui, -apple-system, Arial, sans-serif;
      font-size: 15px;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }
    a {
      color: var(--primary);
      text-decoration: none;
      text-underline-offset: 2px;
    }
    a:hover { text-decoration: underline; }

    .container{
      max-width: 1120px;
      margin: 0 auto;
      padding: 22px 18px 52px;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .page-title{
      margin: 12px 0 8px;
      font-size: 28px;
      letter-spacing: -0.3px;
      line-height: 1.25;
    }
    .page-subtitle{
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.7;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      cursor:pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      text-decoration:none;
      box-shadow: var(--shadow);
      white-space: nowrap;
      transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .05s ease;
    }
    .btn:hover{
      background: #f8fafc;
      text-decoration: none;
    }
    .btn:active{ transform: translateY(1px); }
    .btn:focus-visible{
      outline: none;
      box-shadow: var(--focus-ring), var(--shadow);
    }
    .btn-primary{
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover{ background: var(--primary2); border-color: var(--primary2); }
    .btn-primary:focus-visible{
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .9), var(--focus-ring);
    }
    .btn-danger{
      background: transparent;
      border-color: transparent;
      color: var(--danger);
      box-shadow: none;
      padding: 8px 8px;
    }
    .btn-link{
      background: transparent;
      border-color: transparent;
      box-shadow:none;
      padding: 8px 8px;
      color: var(--primary);
    }

    .muted{ color: var(--muted); }

    .grid-3{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 900px){
      .grid-3{ grid-template-columns: 1fr; }
    }

    .toolbar{
      display:flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      margin-top: 12px;
      margin-bottom: 14px;
    }

    .field{
      display:flex;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
    }
    label{ font-weight: 600; font-size: 13px; color: var(--text); }
    input[type="text"], input[type="date"], select, textarea{
      width:100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      background: #fff;
      outline: none;
    }
    input[type="text"]:focus, input[type="date"]:focus, select:focus, textarea:focus{
      border-color: rgba(53, 92, 155, .55);
      box-shadow: var(--focus-ring);
    }
    textarea{ min-height: 110px; }

    .table{
      width:100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fff;
      box-shadow: var(--shadow);
    }
    .table th, .table td{
      padding: 12px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      text-align: right;
      font-size: 14px;
    }
    .table th{
      background: #f8fafc;
      font-size: 13px;
      color: #344054;
      font-weight: 700;
    }
    .table tr:last-child td{ border-bottom: none; }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: #475467;
      white-space: nowrap;
    }
    .badge-ok{ border-color: #a6f4c5; background: #ecfdf3; color: var(--ok); }
    .badge-warn{ border-color: #fedf89; background: #fffaeb; color: var(--warn); }
    .badge-bad{ border-color: #fecdca; background: #fef3f2; color: var(--danger); }

    .two-col{
      display:grid;
      grid-template-columns: 1.3fr .9fr;
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 980px){
      .two-col{ grid-template-columns: 1fr; }
    }

    .section-title{
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.1px;
    }
    pre{
      margin: 0;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fbfbfb;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 50vh;
      overflow:auto;
    }

    .viewer img { max-width: 100%; height: auto; border-radius: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    .viewer iframe { width: 100%; height: 75vh; border-radius: 14px; border: 1px solid var(--border); box-shadow: var(--shadow); background:#fff; }

    .meta-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px 12px;
      margin-top: 10px;
    }
    @media (max-width: 900px){
      .meta-grid{ grid-template-columns: 1fr; }
    }
    .meta-item{
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
    }
    .meta-item .k{ font-size: 12px; color: var(--muted); font-weight: 700; }
    .meta-item .v{ font-size: 14px; margin-top: 2px; }

    .spacer{ height: 10px; }

    .nav-shell{
      padding: 12px 14px;
      border-radius: 18px;
      box-shadow: var(--shadow2);
      border-color: #e4e7ec;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(4px);
    }
    .nav-row{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .nav-brand{
      font-weight: 900;
      letter-spacing: -0.3px;
    }
    .nav-brand-link{
      color: var(--text);
      text-decoration: none;
    }
    .nav-brand-link:hover{
      text-decoration: none;
    }
    .nav-links{
      display:flex;
      gap:8px;
      align-items:center;
      margin-inline-start: 10px;
      flex-wrap: wrap;
    }
    .nav-spacer{ flex:1; }
    .nav-user{
      font-size: 13px;
      padding-inline: 2px;
    }

    /* בקרת תמלול — review detail workspace (layout only) */
    .container:has(.review-page){
      max-width: 1320px;
    }
    .review-header{
      padding: 14px 16px;
    }
    .review-header-toolbar{
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .review-header-badges{
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 10px;
    }
    .review-status-help{
      margin-top: 10px;
      font-size: 13px;
    }
    .review-status-help ul{
      margin: 8px 0 0;
      padding-inline-start: 20px;
      color: var(--muted);
    }
    .review-header-meta{
      margin-top: 10px;
      font-size: 13px;
    }
    .review-guidance{
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(53, 92, 155, 0.22);
      background: #f0f5fc;
      font-size: 14px;
      line-height: 1.65;
    }
    .review-source-note{
      margin-top: 6px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.6;
    }
    .review-source-page{
      margin-top: 12px;
    }
    .review-source-page-label{
      font-size: 13px;
      margin-bottom: 6px;
    }
    .review-result-description{
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.55;
    }
    .review-result-type-badge{
      font-weight: 800;
    }
    .review-zone--primary{
      background: #fafbfc;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-top: 12px;
    }
    .review-zone--primary .review-zone-title{
      margin-bottom: 10px;
    }
    .review-non-actionable-reason{
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .review-details--secondary{
      margin-top: 14px;
      opacity: 0.92;
    }
    .review-details--secondary > summary{
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
    }
    .review-workspace{
      display: grid;
      grid-template-columns: minmax(280px, 0.95fr) minmax(320px, 1.15fr);
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 980px){
      .review-workspace{ grid-template-columns: 1fr; }
    }
    @media (min-width: 981px){
      .review-source-panel{
        position: sticky;
        top: 16px;
        align-self: start;
        max-height: calc(100vh - 32px);
        overflow: auto;
      }
    }
    .review-source-panel,
    .review-transcription-panel{
      padding: 16px;
    }
    .review-panel-head{
      display: flex;
      gap: 10px;
      align-items: baseline;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .review-result-card{
      padding: 14px;
      margin-top: 12px;
    }
    .review-result-card:first-of-type{
      margin-top: 0;
    }
    .review-result-card--pending{
      border-color: rgba(181, 71, 8, 0.35);
    }
    .review-result-head{
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .review-zone{
      border-top: 1px solid var(--border);
      margin-top: 12px;
      padding-top: 12px;
    }
    .review-zone-title{
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .review-zone-actions{
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .review-textarea{
      width: 100%;
      min-height: min(50vh, 480px);
      font-size: 15px;
      line-height: 1.6;
      resize: vertical;
    }
    .review-readonly-text{
      margin: 0;
      max-height: 50vh;
    }
    .review-details{
      margin-top: 10px;
      font-size: 13px;
    }
    .review-details > summary{
      cursor: pointer;
      font-weight: 700;
      color: var(--text);
      list-style: none;
    }
    .review-details > summary::-webkit-details-marker{
      display: none;
    }
    .review-details > summary::before{
      content: "▸ ";
      display: inline-block;
      transition: transform 0.15s ease;
    }
    .review-details[open] > summary::before{
      transform: rotate(90deg);
    }
    .review-details-body{
      margin-top: 10px;
      color: var(--muted);
    }
    .review-transkribus-details{
      margin-top: 14px;
      padding: 14px 16px;
    }
    .review-transkribus-details > summary.section-title{
      margin: 0;
    }

    /* Make buttons in forms look like links (used for logout) */
    .nav-btn{
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      font: inherit;
      color: var(--primary);
      text-decoration: none;
    }
    .nav-btn:hover{ text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    {% include "partials/nav.html" %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
