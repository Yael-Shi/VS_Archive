<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    .box { max-width: 420px; }
    label { display: block; margin-top: 12px; }
    input { width: 100%; padding: 8px; }
    button { margin-top: 16px; padding: 8px 12px; }
    .error { color: #b00020; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Login</h1>

    <!-- Django auth views expect this template at registration/login.html -->
    {% if form.errors %}
      <div class="error">
        Invalid username or password.
      </div>
    {% endif %}

    {% if next %}
      <p>You will be redirected after login.</p>
    {% endif %}

    <form method="post" action="">
      {% csrf_token %}

      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" autofocus required />

      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" required />

      <!-- Preserve redirect target -->
      <input type="hidden" name="next" value="{{ next }}" />

      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
