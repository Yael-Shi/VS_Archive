<script>
(() => {
  const targets = Array.from(
    document.querySelectorAll(
      ".archive-search-overlay-target[data-archive-search-match-index]"
    )
  );

  if (!targets.length) {
    return;
  }

  const pages = Array.from(
    document.querySelectorAll("[data-archive-search-page-index]")
  );
  const transcriptionTargets = Array.from(
    document.querySelectorAll(
      "[data-archive-search-transcription-match-index]"
    )
  );
  const nav = document.querySelector("[data-archive-search-match-nav]");
  const status = nav?.querySelector("[data-archive-search-match-status]");
  const previousButton = nav?.querySelector(
    "[data-archive-search-match-previous]"
  );
  const nextButton = nav?.querySelector(
    "[data-archive-search-match-next]"
  );

  const targetByMatchIndex = new Map();

  targets.forEach((target) => {
    const matchIndex = target.dataset.archiveSearchMatchIndex;
    if (!targetByMatchIndex.has(matchIndex)) {
      targetByMatchIndex.set(matchIndex, target);
    }
  });

  const transcriptionTargetByMatchIndex = new Map();

  transcriptionTargets.forEach((target) => {
    const matchIndex = target.dataset.archiveSearchTranscriptionMatchIndex;
    if (!transcriptionTargetByMatchIndex.has(matchIndex)) {
      transcriptionTargetByMatchIndex.set(matchIndex, target);
    }
  });

  const orderedMatchIndexes = Array.from(targetByMatchIndex.keys())
    .map((value) => Number.parseInt(value, 10))
    .filter((value) => Number.isInteger(value))
    .sort((left, right) => left - right);

  if (!orderedMatchIndexes.length) {
    return;
  }

  let activePosition = 0;

  const updateNavigation = () => {
    if (status) {
      status.textContent =
        `התאמה ${activePosition + 1} מתוך ${orderedMatchIndexes.length}`;
    }

    if (previousButton) {
      previousButton.disabled = activePosition === 0;
    }

    if (nextButton) {
      nextButton.disabled =
        activePosition === orderedMatchIndexes.length - 1;
    }
  };

  // Scroll the overlay target inside the sticky/overflow source panel when
  // possible. Fail closed if no mapped overlay exists for the match index.
  const scrollSourceForMatch = (matchValue) => {
    const activeTarget = targetByMatchIndex.get(matchValue);

    if (!activeTarget || typeof activeTarget.scrollIntoView !== "function") {
      return false;
    }

    activeTarget.scrollIntoView({
      behavior: "smooth",
      block: "center",
      inline: "nearest",
    });
    return true;
  };

  const scrollTranscriptionForMatch = (matchValue) => {
    const transcriptionTarget =
      transcriptionTargetByMatchIndex.get(matchValue);

    if (
      !transcriptionTarget ||
      typeof transcriptionTarget.scrollIntoView !== "function"
    ) {
      return false;
    }

    transcriptionTarget.scrollIntoView({
      behavior: "smooth",
      block: "center",
      inline: "nearest",
    });
    return true;
  };

  // scrollSide:
  //   "none" — activate/highlight only
  //   "transcription" — opposite-side transcription only (source overlay click)
  //   "source" — opposite-side source only (transcription match click)
  //   "preferTranscription" — previous/next: transcription, else source fallback
  // Never issues both page-level scrolls in one activation.
  const setActiveMatch = (matchIndex, { scrollSide = "none" } = {}) => {
    const matchValue = String(matchIndex);
    const position = orderedMatchIndexes.indexOf(matchIndex);

    if (position === -1) {
      return;
    }

    activePosition = position;

    targets.forEach((target) => {
      target.classList.toggle(
        "archive-search-overlay-target--active",
        target.dataset.archiveSearchMatchIndex === matchValue
      );
    });

    transcriptionTargets.forEach((target) => {
      target.classList.toggle(
        "archive-search-transcription-match--active",
        target.dataset.archiveSearchTranscriptionMatchIndex === matchValue
      );
    });

    updateNavigation();

    if (scrollSide === "none") {
      return;
    }

    if (scrollSide === "transcription") {
      scrollTranscriptionForMatch(matchValue);
      return;
    }

    if (scrollSide === "source") {
      scrollSourceForMatch(matchValue);
      return;
    }

    if (scrollSide === "preferTranscription") {
      if (scrollTranscriptionForMatch(matchValue)) {
        return;
      }
      scrollSourceForMatch(matchValue);
    }
  };

  const activatePosition = (position) => {
    if (position < 0 || position >= orderedMatchIndexes.length) {
      return;
    }

    setActiveMatch(orderedMatchIndexes[position], {
      scrollSide: "preferTranscription",
    });
  };

  const parseMatchIndex = (rawValue) => {
    const matchIndex = Number.parseInt(rawValue || "", 10);
    return Number.isInteger(matchIndex) ? matchIndex : null;
  };

  targets.forEach((target) => {
    target.addEventListener("click", () => {
      const matchIndex = parseMatchIndex(
        target.dataset.archiveSearchMatchIndex
      );

      if (matchIndex !== null) {
        // Source overlay click: activate + scroll transcription only.
        // Do not scroll the source page the user just clicked.
        setActiveMatch(matchIndex, { scrollSide: "transcription" });
      }
    });
  });

  // All spans sharing a match index are valid click sources (multi-span case).
  transcriptionTargets.forEach((target) => {
    const activateFromTranscription = () => {
      const matchIndex = parseMatchIndex(
        target.dataset.archiveSearchTranscriptionMatchIndex
      );

      if (matchIndex !== null) {
        // Transcription click: activate + scroll source only.
        // Do not re-scroll the transcription the user just clicked.
        setActiveMatch(matchIndex, { scrollSide: "source" });
      }
    };

    target.addEventListener("click", activateFromTranscription);
    target.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") {
        return;
      }
      event.preventDefault();
      activateFromTranscription();
    });
  });

  previousButton?.addEventListener("click", () => {
    activatePosition(activePosition - 1);
  });

  nextButton?.addEventListener("click", () => {
    activatePosition(activePosition + 1);
  });

  // Initial activation: highlight only, with legacy multi-page source scroll.
  // Do not prefer transcription scroll on page load.
  setActiveMatch(orderedMatchIndexes[0], {
    scrollSide: pages.length > 1 ? "source" : "none",
  });
})();
</script>
