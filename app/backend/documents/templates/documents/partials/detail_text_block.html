<div class="detail-text-block">
  {% if block %}
    {% if is_admin %}
      <div class="detail-text-block__title">{{ meta.label }}</div>
    {% elif block.text %}
      <div class="detail-text-block__title">תמלול</div>
    {% endif %}

    {% if block.text %}
      <div class="detail-text-block__body">
        <pre>{{ block.text }}</pre>
      </div>
    {% else %}
      <div class="muted">{{ meta.empty_message }}</div>
    {% endif %}
  {% else %}
    <div class="muted page-lead">{{ meta.empty_message }}</div>
  {% endif %}
</div>
