<div class="detail-technical-text-result">
  <div class="badge-row">
    <span class="badge">{{ block.result_type }}</span>
    <span class="badge">{{ block.status }}</span>
    <span class="badge">{{ block.verification_status }}</span>
    <span class="badge">{{ block.engine }}</span>
    <span class="muted">{{ block.created_at }}</span>
  </div>
  {% if block.status == "FAILED" %}
    <div class="spacer-sm"></div>
    <div class="muted text-sm">
      <strong>error_code:</strong> <code>{{ block.error_code }}</code><br/>
      <strong>details:</strong> {{ block.error_details }}
    </div>
  {% endif %}
</div>
