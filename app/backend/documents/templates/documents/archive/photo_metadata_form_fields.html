<div class="field">
  <label for="title">תיאור קצר *</label>
  <input id="title" name="title" type="text" value="{{ form_data.title }}" />
</div>

<div class="field">
  <label for="description">תיאור / כיתוב</label>
  <textarea id="description" name="description" rows="3">{{ form_data.description }}</textarea>
</div>

<div class="field">
  <label for="location">מיקום</label>
  <input id="location" name="location" type="text" value="{{ form_data.location }}" />
</div>

<div class="field">
  <label for="context">הקשר / נסיבות</label>
  <textarea id="context" name="context" rows="3">{{ form_data.context }}</textarea>
</div>

<div class="field">
  <label for="people_present">נוכחים בתמונה</label>
  <textarea id="people_present" name="people_present" rows="2">{{ form_data.people_present }}</textarea>
</div>

<div class="field">
  <label for="notes">הערות נוספות</label>
  <textarea id="notes" name="notes" rows="3">{{ form_data.notes }}</textarea>
</div>

<div class="field">
  <label for="public_note">הערת הארכיון</label>
  <textarea id="public_note" name="public_note" rows="3">{{ form_data.public_note }}</textarea>
</div>

<div class="field">
  <label for="visibility">נראות / גישה</label>
  <select id="visibility" name="visibility">
    {% for value, label in visibility_choices %}
      <option value="{{ value }}" {% if form_data.visibility == value %}selected{% endif %}>
        {{ label }}
      </option>
    {% endfor %}
  </select>
</div>

<div class="meta-grid">
  <div class="field">
    <label for="date_start">תאריך התחלה</label>
    <input id="date_start" name="date_start" type="date" value="{{ form_data.date_start }}" />
  </div>
  <div class="field">
    <label for="date_end">תאריך סיום</label>
    <input id="date_end" name="date_end" type="date" value="{{ form_data.date_end }}" />
  </div>
</div>

<div class="meta-grid">
  <div class="field">
    <label for="date_precision">דיוק תאריך</label>
    <select id="date_precision" name="date_precision">
      {% for value, label in date_precision_choices %}
        <option value="{{ value }}" {% if form_data.date_precision == value %}selected{% endif %}>
          {{ label }}
        </option>
      {% endfor %}
    </select>
  </div>

  <div class="field">
    <label for="metadata_status">השלמת פרטים</label>
    <select id="metadata_status" name="metadata_status">
      {% for value, label in metadata_status_choices %}
        <option value="{{ value }}" {% if form_data.metadata_status == value %}selected{% endif %}>
          {{ label }}
        </option>
      {% endfor %}
    </select>
  </div>
</div>
