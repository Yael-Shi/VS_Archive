<div class="field">
  <label for="date_precision">דיוק תאריך</label>
  <select id="date_precision" name="date_precision">
    {% for value, label in date_precision_choices %}
      <option value="{{ value }}" {% if form_data.date_precision == value %}selected{% endif %}>
        {{ label }}
      </option>
    {% endfor %}
  </select>
</div>

<div class="archive-date-entry" id="archiveDateEntry">
  <div class="archive-date-ui" data-date-ui="desktop">
    <div
      class="archive-date-group archive-date-group--single"
      data-date-precision-group="YEAR"
      {% if form_data.date_precision != "YEAR" %}hidden{% endif %}
    >
      <div class="archive-date-logical-field">
        <label class="archive-date-group-label" for="date_start_year_desktop_year">תאריך</label>
        <div class="archive-date-control" dir="ltr" lang="en">
          <input
            id="date_start_year_desktop_year"
            name="date_start_year"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            maxlength="4"
            placeholder="YYYY"
            value="{{ form_data.date_start_year }}"
            class="archive-date-input archive-date-input-year"
            {% if form_data.date_precision != "YEAR" %}disabled{% endif %}
          />
        </div>
      </div>
    </div>

    <div
      class="archive-date-group archive-date-group--single"
      data-date-precision-group="MONTH"
      {% if form_data.date_precision != "MONTH" %}hidden{% endif %}
    >
      <div class="archive-date-logical-field">
        <label class="archive-date-group-label" id="archive_date_month_desktop_label" for="date_start_month_desktop_month">תאריך</label>
        <div
          class="archive-date-control"
          dir="ltr"
          lang="en"
          role="group"
          aria-labelledby="archive_date_month_desktop_label"
        >
          <span class="archive-date-part archive-date-part-month">
            <input
              id="date_start_month_desktop_month"
              name="date_start_month"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              maxlength="2"
              placeholder="MM"
              value="{{ form_data.date_start_month }}"
              class="archive-date-input archive-date-input-month"
              aria-label="חודש"
              {% if form_data.date_precision != "MONTH" %}disabled{% endif %}
            />
            <span class="archive-date-separator" aria-hidden="true">/</span>
          </span>
          <span class="archive-date-part archive-date-part-year">
            <input
              id="date_start_year_desktop_month"
              name="date_start_year"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              maxlength="4"
              placeholder="YYYY"
              value="{{ form_data.date_start_year }}"
              class="archive-date-input archive-date-input-year"
              aria-label="שנה"
              {% if form_data.date_precision != "MONTH" %}disabled{% endif %}
            />
          </span>
        </div>
      </div>
    </div>

    <div
