{# Presigned S3 upload JS for PHOTO create/add (no OCR/Document pipeline). #}
<script>
  const form = document.getElementById("photoUploadForm");
  const msgEl = document.getElementById("msg");
  const submitBtn = document.getElementById("submitBtn");
  const fileEl = document.getElementById("file");
  const uploadMode = (form && form.dataset.mode) || "create";
  const createUrl = (form && form.dataset.createUrl) || "/api/photo-uploads/create/";
  const completeUrlTemplate = (form && form.dataset.completeUrlTemplate) || "/api/photo-uploads/__ID__/complete/";
  const redirectUrl = (form && form.dataset.redirectUrl) || "/archive/manage/";

  function setMessage(kind, text) {
    msgEl.className = "msg";
    if (kind === "error") msgEl.classList.add("msg-error");
    else if (kind === "ok") msgEl.classList.add("msg-ok");
    msgEl.textContent = text || "";
  }

  function getCsrfToken() {
    const input = document.querySelector("#photoUploadForm input[name=csrfmiddlewaretoken]");
    if (input && input.value) {
      return input.value;
    }
    const name = "csrftoken";
    if (!document.cookie) return "";
    for (const part of document.cookie.split(";")) {
      const cookie = part.trim();
      if (cookie.startsWith(name + "=")) {
        return decodeURIComponent(cookie.substring(name.length + 1));
      }
    }
    return "";
  }

  async function jsonFetch(url, options) {
    const headers = Object.assign(
      {"Content-Type": "application/json", "X-CSRFToken": getCsrfToken()},
      (options && options.headers) || {}
    );
    const res = await fetch(url, Object.assign({}, options || {}, {headers}));
    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch (_) {}
    if (!res.ok) {
      const err = (data && (data.error || data.detail)) ? (data.error || data.detail) : text;
      throw new Error(`HTTP ${res.status}: ${err}`);
    }
    return data;
  }

  function readSelectedIds(selectId) {
    const el = document.getElementById(selectId);
    if (!el) return [];
    return Array.from(el.selectedOptions)
      .map((option) => parseInt(option.value, 10))
      .filter((id) => !Number.isNaN(id));
  }

  function readFormMeta() {
    const get = (id) => {
      const el = document.getElementById(id);
      return el ? (el.value || "").trim() : "";
    };
    const getMultiline = (id) => {
      const el = document.getElementById(id);
      return el ? (el.value || "") : "";
    };
    if (uploadMode === "add") {
      const meta = {
        archive_item_id: parseInt(form.dataset.archiveItemId || "", 10),
        description: get("description"),
        location: get("location"),
        context: getMultiline("context"),
        people_present: get("people_present"),
        notes: getMultiline("notes"),
      };
      if (window.vsArchiveDateEntry && window.vsArchiveDateEntry.collectMeta) {
        window.vsArchiveDateEntry.collectMeta(meta);
      }
      return meta;
    }
    const meta = {
      title: get("title"),
      description: get("description"),
      location: get("location"),
      context: getMultiline("context"),
      people_present: get("people_present"),
      notes: getMultiline("notes"),
      public_note: getMultiline("public_note"),
      visibility: get("visibility") || "private",
      metadata_status: get("metadata_status") || "NEEDS_COMPLETION",
      categories: get("categories"),
      events: get("events"),
      discovery_tags: get("discovery_tags"),
    };
    if (window.vsArchiveDateEntry && window.vsArchiveDateEntry.collectMeta) {
      window.vsArchiveDateEntry.collectMeta(meta);
    }
    const selected_categories = readSelectedIds("selected_categories");
    const selected_events = readSelectedIds("selected_events");
    const selected_tags = readSelectedIds("selected_tags");
    if (selected_categories.length) meta.selected_categories = selected_categories;
    if (selected_events.length) meta.selected_events = selected_events;
    if (selected_tags.length) meta.selected_tags = selected_tags;
    return meta;
  }

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    setMessage("", "");
    submitBtn.disabled = true;

    try {
      const file = (fileEl.files && fileEl.files[0]) || null;
      if (!file) {
        throw new Error("יש לבחור קובץ תמונה");
      }

      const mime_type = file.type || "application/octet-stream";
      const meta = readFormMeta();
      const createPayload = Object.assign({}, meta, {
        original_name: file.name,
        mime_type,
      });

      setMessage("ok", uploadMode === "add" ? "מוסיפה תמונה לפריט…" : "יוצרת פריט תמונה…");
      const created = await jsonFetch(createUrl, {
        method: "POST",
        body: JSON.stringify(createPayload),
      });

      const photoContentId = created.photo_content_id;
      const uploadUrl = created.upload_url;
      if (!photoContentId || !uploadUrl) {
        throw new Error("Create response missing photo_content_id or upload_url");
      }

      setMessage("ok", `מעלה ל-S3… (תמונה #${photoContentId})`);
      const putRes = await fetch(uploadUrl, {
        method: "PUT",
        headers: {"Content-Type": mime_type},
        body: file,
      });
      const completeUrl = completeUrlTemplate.replace("__ID__", String(photoContentId));
      if (!putRes.ok) {
        const putText = await putRes.text().catch(() => "");
        try {
          await jsonFetch(completeUrl, {
            method: "POST",
            body: JSON.stringify({ success: false, error: `S3 PUT failed: HTTP ${putRes.status}` }),
          });
        } catch (_) {}
        throw new Error(`S3 PUT failed: HTTP ${putRes.status} ${putText}`);
      }

      setMessage("ok", "מאמתת העלאה…");
      const completed = await jsonFetch(completeUrl, {
        method: "POST",
        body: JSON.stringify({
          success: true,
          file_mime: mime_type,
        }),
      });

      if (!completed.upload_complete) {
        throw new Error(completed.error || "העלאה לא הושלמה");
      }

      setMessage("ok", "בוצע. מעבירה…");
      window.location.href = redirectUrl;
    } catch (err) {
      setMessage("error", err && err.message ? err.message : String(err));
      submitBtn.disabled = false;
    }
  });
</script>
