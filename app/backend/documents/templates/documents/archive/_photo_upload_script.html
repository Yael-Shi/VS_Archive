{# Presigned S3 upload JS for PHOTO create/add (no OCR/Document pipeline). #}
<script>
  const form = document.getElementById("photoUploadForm");
  const msgEl = document.getElementById("msg");
  const submitBtn = document.getElementById("submitBtn");
  const fileEl = document.getElementById("file");
  const uploadMode = (form && form.dataset.mode) || "create";
  const createUrl = (form && form.dataset.createUrl) || "/api/photo-uploads/create/";
  const addUrl = (form && form.dataset.addUrl) || "/api/photo-uploads/add/";
  const completeUrlTemplate = (form && form.dataset.completeUrlTemplate) || "/api/photo-uploads/__ID__/complete/";
  const redirectUrl = (form && form.dataset.redirectUrl) || "/archive/manage/";
  const itemRedirectUrlTemplate = (form && form.dataset.itemRedirectUrlTemplate) || "";

  // Mirrors documents/services/upload_validation.py so every selected file is
  // rejected before any ArchiveItem or PhotoContent row is created.
  const ALLOWED_IMAGE_EXTENSIONS_BY_MIME = {
    "image/jpeg": [".jpg", ".jpeg"],
    "image/png": [".png"],
    "image/tiff": [".tif", ".tiff"],
    "image/webp": [".webp"],
  };
  const MIME_TYPE_ALIASES = {
    "image/jpg": "image/jpeg",
    "image/pjpeg": "image/jpeg",
  };

  function setMessage(kind, text) {
    msgEl.className = "msg";
    if (kind === "error") msgEl.classList.add("msg-error");
    else if (kind === "ok") msgEl.classList.add("msg-ok");
    msgEl.textContent = text || "";
  }

  function itemManageUrl(archiveItemId) {
    if (!itemRedirectUrlTemplate || !archiveItemId) return "";
    return itemRedirectUrlTemplate.replace("__ITEM_ID__", String(archiveItemId));
  }

  function setErrorMessageWithItemLink(text, archiveItemId) {
    setMessage("error", text);
    const href = itemManageUrl(archiveItemId);
    if (!href) return;
    msgEl.appendChild(document.createTextNode(" "));
    const link = document.createElement("a");
    link.href = href;
    link.textContent = "מעבר לדף ניהול הפריט שנוצר";
    msgEl.appendChild(link);
  }

  function getCsrfToken() {
    const input = document.querySelector("#photoUploadForm input[name=csrfmiddlewaretoken]");
    if (input && input.value) {
      return input.value;
    }
    const name = "csrftoken";
    if (!document.cookie) return "";
    for (const part of document.cookie.split(";")) {
      const cookie = part.trim();
      if (cookie.startsWith(name + "=")) {
        return decodeURIComponent(cookie.substring(name.length + 1));
      }
    }
    return "";
  }

  async function jsonFetch(url, options) {
    const headers = Object.assign(
      {"Content-Type": "application/json", "X-CSRFToken": getCsrfToken()},
      (options && options.headers) || {}
    );
    const res = await fetch(url, Object.assign({}, options || {}, {headers}));
    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch (_) {}
    if (!res.ok) {
      const err = (data && (data.error || data.detail)) ? (data.error || data.detail) : text;
      throw new Error(`HTTP ${res.status}: ${err}`);
    }
    return data;
  }

  function readSelectedIds(selectId) {
    const el = document.getElementById(selectId);
    if (!el) return [];
    return Array.from(el.selectedOptions)
      .map((option) => parseInt(option.value, 10))
      .filter((id) => !Number.isNaN(id));
  }

  function readFormMeta() {
    const get = (id) => {
      const el = document.getElementById(id);
      return el ? (el.value || "").trim() : "";
    };
    const getMultiline = (id) => {
      const el = document.getElementById(id);
      return el ? (el.value || "") : "";
    };
    if (uploadMode === "add") {
      const meta = {
        archive_item_id: parseInt(form.dataset.archiveItemId || "", 10),
        description: get("description"),
        location: get("location"),
        context: getMultiline("context"),
        people_present: get("people_present"),
        notes: getMultiline("notes"),
        person_ids: readSelectedIds("person_ids"),
      };
      const newPersonNameEl = document.getElementById("new_person_name");
      const new_person_name = newPersonNameEl
        ? (newPersonNameEl.value || "").trim()
        : "";
      if (new_person_name) {
        meta.new_person_name = new_person_name;
      }
      if (window.vsArchiveDateEntry && window.vsArchiveDateEntry.collectMeta) {
        window.vsArchiveDateEntry.collectMeta(meta);
      }
      return meta;
    }
    const meta = {
      title: get("title"),
      description: get("description"),
      location: get("location"),
      context: getMultiline("context"),
      people_present: get("people_present"),
      notes: getMultiline("notes"),
      public_note: getMultiline("public_note"),
      visibility: get("visibility") || "private",
      metadata_status: get("metadata_status") || "NEEDS_COMPLETION",
      categories: get("categories"),
      events: get("events"),
      discovery_tags: get("discovery_tags"),
    };
    if (window.vsArchiveDateEntry && window.vsArchiveDateEntry.collectMeta) {
      window.vsArchiveDateEntry.collectMeta(meta);
    }
    const selected_categories = readSelectedIds("selected_categories");
    const selected_events = readSelectedIds("selected_events");
    const selected_tags = readSelectedIds("selected_tags");
    if (selected_categories.length) meta.selected_categories = selected_categories;
    if (selected_events.length) meta.selected_events = selected_events;
    if (selected_tags.length) meta.selected_tags = selected_tags;
    meta.archive_item_person_ids = readSelectedIds("archive_item_person_ids");
    const newPersonNameEl = document.getElementById("new_archive_item_person_name");
    const new_archive_item_person_name = newPersonNameEl
      ? (newPersonNameEl.value || "").trim()
      : "";
    if (new_archive_item_person_name) {
      meta.new_archive_item_person_name = new_archive_item_person_name;
    }
    return meta;
  }

  function normalizeMimeType(rawMimeType) {
    const base = String(rawMimeType || "").trim().toLowerCase().split(";")[0].trim();
    return MIME_TYPE_ALIASES[base] || base;
  }

  function fileExtension(originalName) {
    const name = String(originalName || "").trim().toLowerCase();
    if (name.indexOf(".") === -1) return "";
    return "." + name.split(".").pop();
  }

  function mimeTypeForFile(file) {
    return normalizeMimeType(file.type) || "application/octet-stream";
  }

  function imageFileValidationError(file) {
    const allowedExtensions = ALLOWED_IMAGE_EXTENSIONS_BY_MIME[mimeTypeForFile(file)];
    if (!allowedExtensions) {
      return `הקובץ ״${file.name}״ אינו בפורמט תמונה נתמך (JPEG, PNG, TIFF, WebP)`;
    }
    if (allowedExtensions.indexOf(fileExtension(file.name)) === -1) {
      return `סיומת הקובץ ״${file.name}״ אינה תואמת לסוג התמונה שלו`;
    }
    return "";
  }

  function selectedFiles() {
    const files = Array.from((fileEl && fileEl.files) || []);
    // Add mode stays a strict one-file operation.
    return uploadMode === "add" ? files.slice(0, 1) : files;
  }

  function progressSuffix(index, total) {
    return total > 1 ? ` (תמונה ${index + 1} מתוך ${total})` : "";
  }

  /**
   * Shared PUT + complete lifecycle for both the create and add plans.
   * Best-effort complete(success=false) is preserved for failed PUTs.
   */
  async function uploadPlannedPhoto(plan, file, mimeType, suffix) {
    const photoContentId = plan && plan.photo_content_id;
    const uploadUrl = plan && plan.upload_url;
    if (!photoContentId || !uploadUrl) {
      throw new Error("Create response missing photo_content_id or upload_url");
    }

    setMessage("ok", `מעלה ל-S3…${suffix}`);
    const putRes = await fetch(uploadUrl, {
      method: "PUT",
      headers: {"Content-Type": mimeType},
      body: file,
    });
    const completeUrl = completeUrlTemplate.replace("__ID__", String(photoContentId));
    if (!putRes.ok) {
      const putText = await putRes.text().catch(() => "");
      try {
        await jsonFetch(completeUrl, {
          method: "POST",
          body: JSON.stringify({ success: false, error: `S3 PUT failed: HTTP ${putRes.status}` }),
        });
      } catch (_) {}
      throw new Error(`S3 PUT failed: HTTP ${putRes.status} ${putText}`);
    }

    setMessage("ok", `מאמתת העלאה…${suffix}`);
    const completed = await jsonFetch(completeUrl, {
      method: "POST",
      body: JSON.stringify({
        success: true,
        file_mime: mimeType,
      }),
    });
    if (!completed || !completed.upload_complete) {
      throw new Error((completed && completed.error) || "העלאה לא הושלמה");
    }
    return completed;
  }

  function batchFailureMessage(progress, err) {
    const detail = err && err.message ? err.message : String(err);
    if (progress.total <= 1) {
      return progress.archiveItemId
        ? `הפריט נוצר אך העלאת התמונה לא הושלמה. שגיאה: ${detail}`
        : detail;
    }
    return (
      `ההעלאה נעצרה בקובץ ${progress.failedIndex + 1} מתוך ${progress.total} ` +
      `(״${progress.failedFileName}״). הושלמו ${progress.completedCount} מתוך ` +
      `${progress.total} תמונות. התמונות שכבר הועלו נשמרו ולא נמחקו. שגיאה: ${detail}`
    );
  }

  /**
   * Create mode: the first file creates the ArchiveItem through the create
   * endpoint (shared item metadata and item people are sent once, and the
   * photo-specific fields apply to this first photo only). Every later file
   * uses the add endpoint with blank photo metadata, sequentially, so selected
   * order becomes PhotoContent position order.
   */
  async function runCreateUploads(files, progress) {
    const total = files.length;
    for (let index = 0; index < total; index += 1) {
      const file = files[index];
      const mimeType = mimeTypeForFile(file);
      const suffix = progressSuffix(index, total);
      progress.failedIndex = index;
      progress.failedFileName = file.name;

      let plan;
      if (index === 0) {
        setMessage("ok", `יוצרת פריט תמונה…${suffix}`);
        plan = await jsonFetch(createUrl, {
          method: "POST",
          body: JSON.stringify(Object.assign({}, readFormMeta(), {
            original_name: file.name,
            mime_type: mimeType,
          })),
        });
        progress.archiveItemId = (plan && plan.archive_item_id) || null;
        if (total > 1 && !progress.archiveItemId) {
          throw new Error("Create response missing archive_item_id");
        }
      } else {
        setMessage("ok", `מוסיפה תמונה לפריט…${suffix}`);
        plan = await jsonFetch(addUrl, {
          method: "POST",
          body: JSON.stringify({
            archive_item_id: progress.archiveItemId,
            original_name: file.name,
            mime_type: mimeType,
          }),
        });
      }

      await uploadPlannedPhoto(plan, file, mimeType, suffix);
      progress.completedCount += 1;
    }
  }

  // Add mode keeps its own single-file contract: `createUrl` is the add
  // endpoint here, and the full add form metadata belongs to that one photo.
  async function runAddUpload(file, progress) {
    const mimeType = mimeTypeForFile(file);
    progress.failedIndex = 0;
    progress.failedFileName = file.name;
    setMessage("ok", "מוסיפה תמונה לפריט…");
    const plan = await jsonFetch(createUrl, {
      method: "POST",
      body: JSON.stringify(Object.assign({}, readFormMeta(), {
        original_name: file.name,
        mime_type: mimeType,
      })),
    });
    await uploadPlannedPhoto(plan, file, mimeType, "");
    progress.completedCount += 1;
  }

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    setMessage("", "");
    submitBtn.disabled = true;

    const progress = {
      archiveItemId: null,
      completedCount: 0,
      failedIndex: -1,
      failedFileName: "",
      total: 0,
    };

    try {
      const files = selectedFiles();
      if (!files.length) {
        throw new Error("יש לבחור קובץ תמונה");
      }
      progress.total = files.length;

      // Every file is validated before the first create/add request, so the
      // failing file must be recorded before each check can throw.
      for (let index = 0; index < files.length; index += 1) {
        progress.failedIndex = index;
        progress.failedFileName = files[index].name;
        const validationError = imageFileValidationError(files[index]);
        if (validationError) {
          throw new Error(validationError);
        }
      }

      if (uploadMode === "add") {
        await runAddUpload(files[0], progress);
      } else {
        await runCreateUploads(files, progress);
      }

      setMessage("ok", "בוצע. מעבירה…");
      const target = itemManageUrl(progress.archiveItemId) || redirectUrl;
      window.location.href = target;
    } catch (err) {
      setErrorMessageWithItemLink(
        batchFailureMessage(progress, err),
        progress.archiveItemId
      );
      // Once an ArchiveItem exists, re-submitting the form would create a
      // second item; recovery happens on that item's staff manage page.
      if (!progress.archiveItemId) {
        submitBtn.disabled = false;
      }
    }
  });
</script>
