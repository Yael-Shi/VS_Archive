<script>
(function () {
  var root = document.querySelector("[data-video-embed]");
  if (!root) {
    return;
  }

  var activate = root.querySelector("[data-video-activate]");
  var placeholder = root.querySelector("[data-video-placeholder]");
  var player = root.querySelector("[data-video-player]");
  if (!activate || !placeholder || !player) {
    return;
  }

  var ALLOWED_EMBED_PREFIX = "https://www.youtube-nocookie.com/embed/";
  var EMBED_PATH_RE = /^\/embed\/[A-Za-z0-9_-]{11}$/;
  var CANONICAL_NONNEG_INT_RE = /^(0|[1-9]\d*)$/;
  var CANONICAL_POS_INT_RE = /^[1-9]\d*$/;
  // Only parameters the server embed builder may emit.
  var ALLOWED_QUERY_KEYS = {
    playsinline: true,
    start: true,
    end: true
  };

  function queryHasDuplicateKeys(search) {
    if (!search) {
      return false;
    }
    var raw = search.charAt(0) === "?" ? search.slice(1) : search;
    if (!raw) {
      return false;
    }
    var seen = Object.create(null);
    var parts = raw.split("&");
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (!part) {
        continue;
      }
      var eq = part.indexOf("=");
      var key = eq === -1 ? part : part.slice(0, eq);
      try {
        key = decodeURIComponent(key.replace(/\+/g, " "));
      } catch (err) {
        return true;
      }
      if (Object.prototype.hasOwnProperty.call(seen, key)) {
        return true;
      }
      seen[key] = true;
    }
    return false;
  }

  function isApprovedEmbedQuery(search) {
    // Empty / absent query is allowed (defense-in-depth; server normally emits playsinline=1).
    if (!search) {
      return true;
    }
    if (queryHasDuplicateKeys(search)) {
      return false;
    }
    var params = new URLSearchParams(search);
    var startRaw = null;
    var endRaw = null;
    var playsinlineRaw = null;
    var rejected = false;
    params.forEach(function (value, key) {
      if (!ALLOWED_QUERY_KEYS[key]) {
        rejected = true;
        return;
      }
      if (key === "playsinline") {
        playsinlineRaw = value;
      } else if (key === "start") {
        startRaw = value;
      } else if (key === "end") {
        endRaw = value;
      }
    });
    if (rejected) {
      return false;
    }
    if (playsinlineRaw !== null && playsinlineRaw !== "1") {
      return false;
    }
    if (startRaw !== null && !CANONICAL_NONNEG_INT_RE.test(startRaw)) {
      return false;
    }
    if (endRaw !== null && !CANONICAL_POS_INT_RE.test(endRaw)) {
      return false;
    }
    if (startRaw !== null && endRaw !== null) {
      if (parseInt(endRaw, 10) <= parseInt(startRaw, 10)) {
        return false;
      }
    }
    return true;
  }

  function isApprovedEmbedSrc(src) {
    if (typeof src !== "string" || !src) {
      return false;
    }
    if (src.indexOf(ALLOWED_EMBED_PREFIX) !== 0) {
      return false;
    }
    // Reject unexpected schemes/hosts sneaked via whitespace or control chars.
    if (/\s/.test(src) || src.toLowerCase().indexOf("javascript:") === 0) {
      return false;
    }
    try {
      var parsed = new URL(src);
    } catch (err) {
      return false;
    }
    if (parsed.protocol !== "https:") {
      return false;
    }
    if (parsed.hostname !== "www.youtube-nocookie.com") {
      return false;
    }
    if (parsed.username || parsed.password) {
      return false;
    }
    if (parsed.port && parsed.port !== "443") {
      return false;
    }
    // Exact /embed/<11-char id> path — reject /embed/id/extra and other shapes.
    if (!EMBED_PATH_RE.test(parsed.pathname)) {
      return false;
    }
    if (parsed.hash) {
      return false;
    }
    if (!isApprovedEmbedQuery(parsed.search)) {
      return false;
    }
    return true;
  }

  function activateEmbed() {
    if (root.getAttribute("data-video-activated") === "1") {
      return;
    }
    var src = root.getAttribute("data-embed-src") || "";
    var title = root.getAttribute("data-iframe-title") || "נגן YouTube";
    if (!isApprovedEmbedSrc(src)) {
      return;
    }

    var iframe = document.createElement("iframe");
    iframe.className = "video-embed-facade__iframe";
    iframe.src = src;
    iframe.title = title;
    iframe.setAttribute("allowfullscreen", "");
    iframe.setAttribute(
      "allow",
      "accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen"
    );
    iframe.setAttribute("loading", "lazy");
    // Origin-only cross-origin Referer for YouTube error 153; site-wide
    // Referrer-Policy remains same-origin and does not send the item path.
    iframe.referrerPolicy = "strict-origin-when-cross-origin";

    player.appendChild(iframe);
    player.hidden = false;
    placeholder.hidden = true;
    root.setAttribute("data-video-activated", "1");
    activate.setAttribute("aria-expanded", "true");
    // Disable only after the iframe was created and inserted.
    activate.setAttribute("disabled", "");
    // Keep the iframe in sequential Tab order (native focusability; no tabindex=-1).
    // Move focus off the now-hidden/disabled activation control.
    try {
      iframe.focus();
    } catch (err) {
      // Ignore focus failures in older environments.
    }
  }

  activate.setAttribute("aria-expanded", "false");
  activate.addEventListener("click", function (event) {
    event.preventDefault();
    activateEmbed();
  });
})();
</script>
