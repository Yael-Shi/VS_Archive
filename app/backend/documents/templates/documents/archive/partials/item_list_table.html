{% load document_date_display archive_labels %}
<div class="table-wrap archive-item-list-wrap">
  <table class="table archive-item-list">
    <thead>
      <tr>
        <th>כותרת</th>
        <th>סוג</th>
        <th>תאריך</th>
      </tr>
    </thead>
    <tbody>
      {% for item in items %}
        <tr class="archive-item-row">
          <td class="archive-item-title">
            <a href="{% url 'archive-detail' item_id=item.id %}">{{ item.title }}</a>
            {% if item.item_type == "PHOTO" %}
              <span class="muted"> · תצוגה מקדימה בדף הפריט</span>
            {% endif %}
          </td>
          <td class="archive-item-type" data-label="סוג">{{ item.item_type|archive_item_type_label }}</td>
          <td class="archive-item-date" data-label="תאריך">{{ item|document_date_display }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
