{% if item.author_name or item.source_title %}
  <div class="archive-detail-meta-block archive-detail-meta-block--source">
    {% if item.author_name %}
      <div class="archive-detail-meta-row">
        <strong class="archive-detail-meta-label">מחבר/ת:</strong>
        <span class="archive-detail-meta-value">{{ item.author_name }}</span>
      </div>
    {% endif %}
    {% if item.source_title %}
      <div class="archive-detail-meta-row">
        <strong class="archive-detail-meta-label">מקור:</strong>
        <span class="archive-detail-meta-value">{{ item.source_title }}</span>
      </div>
    {% endif %}
  </div>
{% endif %}
