{% load archive_labels %}
{% with author=item.author_name|meaningful_archive_metadata source=item.source_title|meaningful_archive_metadata %}
  {% if author or source %}
    <div class="archive-detail-meta-block archive-detail-meta-block--source">
      {% if author %}
        <div class="archive-detail-meta-row">
          <strong class="archive-detail-meta-label">מחבר/ת:</strong>
          <span class="archive-detail-meta-value">{{ author }}</span>
        </div>
      {% endif %}
      {% if source %}
        <div class="archive-detail-meta-row">
          <strong class="archive-detail-meta-label">מקור:</strong>
          <span class="archive-detail-meta-value">{{ source }}</span>
        </div>
      {% endif %}
    </div>
  {% endif %}
{% endwith %}
