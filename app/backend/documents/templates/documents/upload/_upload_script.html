{# Single source of truth for presigned S3 upload JS. Include once per page that hosts #uploadForm. #}
<script>
  const MULTI_IMAGE_MIN_FILES = 2;
  const MULTI_IMAGE_MAX_FILES = 35;

  const form = document.getElementById("uploadForm");
  const msgEl = document.getElementById("msg");
  const submitBtn = document.getElementById("submitBtn");

  const fileEl = document.getElementById("file");
  const cameraFileEl = document.getElementById("cameraFile");
  const docTypeEl = document.getElementById("doc_type");
  const selectedFilesEl = document.getElementById("selectedFiles");
  const selectedFilesSummaryEl = document.getElementById("selectedFilesSummary");
  const stagingDiagnosticsEl = document.getElementById("stagingDiagnostics");

  /** Client-side staging; array order is page order (capture/add order). */
  let stagedFiles = [];
  /** TEMP DIAG: staging reset — remove when mobile camera issue is resolved. */
  const stagingDiagState = {
    sourceInputId: "-",
    selectedFilesLen: "-",
    stagedBefore: 0,
    stagedAfter: 0,
    stagedAfterRender: 0,
    renderEmptyBranch: false,
    lastEvent: "init",
    lastClear: "-",
  };

  function renderStagingDiagnostics() {
    if (!stagingDiagnosticsEl) return;
    const d = stagingDiagState;
    stagingDiagnosticsEl.hidden = false;
    stagingDiagnosticsEl.textContent = [
      "[staging diag]",
      `src=${d.sourceInputId}`,
      `sel=${d.selectedFilesLen}`,
      `before=${d.stagedBefore}`,
      `after=${d.stagedAfter}`,
      `render=${d.stagedAfterRender}`,
      `empty=${d.renderEmptyBranch ? "Y" : "N"}`,
      `evt=${d.lastEvent}`,
      d.lastClear !== "-" ? `clear=${d.lastClear}` : null,
      d.appendReject ? `reject=${d.appendReject}` : null,
    ]
      .filter(Boolean)
      .join(" | ");
  }

  function patchStagingDiagnostics(patch) {
    Object.assign(stagingDiagState, patch);
    renderStagingDiagnostics();
  }

  patchStagingDiagnostics({ stagedBefore: 0, stagedAfter: 0, stagedAfterRender: 0 });
  /** @type {Map<File, string>} */
  const previewObjectUrls = new Map();

  function revokePreviewUrl(file) {
    const url = previewObjectUrls.get(file);
    if (!url) return;
    URL.revokeObjectURL(url);
    previewObjectUrls.delete(file);
  }

  function revokeAllPreviewUrls() {
    for (const url of previewObjectUrls.values()) {
      URL.revokeObjectURL(url);
    }
    previewObjectUrls.clear();
  }

  function cleanupPreviewUrls() {
    const current = new Set(stagedFiles);
    for (const [file, url] of [...previewObjectUrls.entries()]) {
      if (!current.has(file)) {
        URL.revokeObjectURL(url);
        previewObjectUrls.delete(file);
      }
    }
  }

  function getPreviewUrl(file) {
    if (!isImageFile(file)) return null;
    const existing = previewObjectUrls.get(file);
    if (existing) return existing;
    const url = URL.createObjectURL(file);
    previewObjectUrls.set(file, url);
    return url;
  }

  function setMessage(kind, text) {
    msgEl.className = "msg";
    if (kind === "error") msgEl.classList.add("msg-error");
    else if (kind === "ok") msgEl.classList.add("msg-ok");
    msgEl.textContent = text || "";
  }

  function parseTags(raw) {
    return (raw || "")
      .split(",")
      .map(s => s.trim())
      .filter(Boolean);
  }

  function getCsrfToken() {
    const input = document.querySelector("#uploadForm input[name=csrfmiddlewaretoken]");
    if (input && input.value) {
      return input.value;
    }
    const name = "csrftoken";
    if (!document.cookie) return "";
    for (const part of document.cookie.split(";")) {
      const cookie = part.trim();
      if (cookie.startsWith(name + "=")) {
        return decodeURIComponent(cookie.substring(name.length + 1));
      }
    }
    return "";
  }

  async function jsonFetch(url, options) {
    const headers = Object.assign(
      {"Content-Type": "application/json", "X-CSRFToken": getCsrfToken()},
      (options && options.headers) || {}
    );
    const res = await fetch(url, Object.assign({}, options || {}, {headers}));
    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch (_) {}
    if (!res.ok) {
      const err = (data && (data.error || data.detail)) ? (data.error || data.detail) : text;
      throw new Error(`HTTP ${res.status}: ${err}`);
    }
    return data;
  }

  function isImageFile(f) {
    return (f.type || "").toLowerCase().startsWith("image/");
  }

  function isPdfFile(f) {
    const mt = (f.type || "").toLowerCase();
    return mt === "application/pdf" || (f.name || "").toLowerCase().endsWith(".pdf");
  }

  function getStagedFiles() {
    return stagedFiles.slice();
  }

  function clearFileInputValue(inputEl) {
    if (!inputEl) return;
    inputEl.value = "";
  }

  function applyFileInputMode() {
    const dt = docTypeEl.value;

    if (dt === "IMAGE") {
      fileEl.setAttribute("accept", "image/*");
    } else if (dt === "PDF") {
      fileEl.setAttribute("accept", "application/pdf");
    } else {
      fileEl.setAttribute("accept", "application/pdf,image/*");
    }

    cameraFileEl.setAttribute("accept", "image/*");
    cameraFileEl.setAttribute("capture", "environment");
  }

  function updateDocTypeFromStaged() {
    if (stagedFiles.length >= MULTI_IMAGE_MIN_FILES) {
      docTypeEl.value = "IMAGE";
      applyFileInputMode();
      return;
    }

    const f = stagedFiles[0];
    if (!f) {
      applyFileInputMode();
      return;
    }

    if (isPdfFile(f)) {
      docTypeEl.value = "PDF";
    } else if (isImageFile(f)) {
      docTypeEl.value = "IMAGE";
    }
    applyFileInputMode();
  }

  function removeStagedFile(index) {
    if (index < 0 || index >= stagedFiles.length) return;
    const stagedBefore = stagedFiles.length;
    const removed = stagedFiles[index];
    revokePreviewUrl(removed);
    stagedFiles.splice(index, 1);
    patchStagingDiagnostics({
      lastEvent: "removeStagedFile",
      stagedBefore: stagedBefore,
      stagedAfter: stagedFiles.length,
      appendReject: null,
    });
    setMessage("", "");
    updateDocTypeFromStaged();
    renderSelectedFiles();
  }

  function appendStagedFiles(selectedFiles, sourceInputEl) {
    const incoming = Array.isArray(selectedFiles)
      ? selectedFiles.slice()
      : Array.from(selectedFiles || []);

    patchStagingDiagnostics({
      sourceInputId: sourceInputEl && sourceInputEl.id ? sourceInputEl.id : "-",
      selectedFilesLen: incoming.length,
      stagedBefore: stagedFiles.length,
      lastEvent: "appendStagedFiles:start",
      appendReject: null,
    });

    if (incoming.length === 0) {
      patchStagingDiagnostics({
        lastEvent: "appendStagedFiles:reject",
        appendReject: "incoming_empty",
        stagedAfter: stagedFiles.length,
      });
      setMessage("error", "לא התקבל קובץ מהמצלמה. נסי לצלם שוב או לבחור מהגלריה.");
      clearFileInputValue(sourceInputEl);
      return;
    }

    const stagedHasPdf = stagedFiles.some((f) => isPdfFile(f));
    const incomingHasPdf = incoming.some((f) => isPdfFile(f));

    if (stagedHasPdf) {
      patchStagingDiagnostics({
        lastEvent: "appendStagedFiles:reject",
        appendReject: "staged_has_pdf",
        stagedAfter: stagedFiles.length,
      });
      setMessage("error", "PDF כבר נבחר. יש להסיר אותו לפני הוספת קבצים נוספים.");
      clearFileInputValue(sourceInputEl);
      return;
    }
    if (incomingHasPdf) {
      if (stagedFiles.length > 0 || incoming.length > 1) {
        patchStagingDiagnostics({
          lastEvent: "appendStagedFiles:reject",
          appendReject: "pdf_not_single",
          stagedAfter: stagedFiles.length,
        });
        setMessage("error", "PDF יש להעלות כקובץ יחיד.");
        clearFileInputValue(sourceInputEl);
        return;
      }
    }

    const unsupported = incoming.filter((f) => !isImageFile(f) && !isPdfFile(f));
    if (unsupported.length > 0) {
      patchStagingDiagnostics({
        lastEvent: "appendStagedFiles:reject",
        appendReject: "unsupported_type",
        stagedAfter: stagedFiles.length,
      });
      setMessage("error", "ניתן להעלות תמונות או PDF בלבד.");
      clearFileInputValue(sourceInputEl);
      return;
    }

    const nonImages = incoming.filter((f) => !isImageFile(f));
    if (stagedFiles.length > 0 && nonImages.length > 0) {
      patchStagingDiagnostics({
        lastEvent: "appendStagedFiles:reject",
        appendReject: "non_image_with_staged",
        stagedAfter: stagedFiles.length,
      });
      setMessage("error", "בהעלאת ריבוי קבצים יש לבחור תמונות בלבד.");
      clearFileInputValue(sourceInputEl);
      return;
    }

    const totalAfter = stagedFiles.length + incoming.length;
    if (totalAfter > MULTI_IMAGE_MAX_FILES) {
      patchStagingDiagnostics({
        lastEvent: "appendStagedFiles:reject",
        appendReject: "max_files",
        stagedAfter: stagedFiles.length,
      });
      setMessage(
        "error",
        `ניתן להעלות עד ${MULTI_IMAGE_MAX_FILES} תמונות במסמך אחד (כרגע ${stagedFiles.length}).`
      );
      clearFileInputValue(sourceInputEl);
      return;
    }

    stagedFiles.push(...incoming);
    patchStagingDiagnostics({
      lastEvent: "appendStagedFiles:push",
      stagedAfter: stagedFiles.length,
    });
    setMessage("", "");
    updateDocTypeFromStaged();
    renderSelectedFiles();
    clearFileInputValue(sourceInputEl);
  }

  function renderSelectedFiles() {
    patchStagingDiagnostics({
      lastEvent: "renderSelectedFiles:start",
      lastClear: "selectedFilesEl.innerHTML",
      renderEmptyBranch: false,
    });
    selectedFilesEl.innerHTML = "";
    cleanupPreviewUrls();

    if (stagedFiles.length === 0) {
      patchStagingDiagnostics({
        lastEvent: "renderSelectedFiles:empty+revokeAllPreviewUrls",
        renderEmptyBranch: true,
        stagedAfterRender: 0,
        lastClear: "empty_branch+revokeAllPreviewUrls",
      });
      revokeAllPreviewUrls();
      selectedFilesSummaryEl.hidden = true;
      selectedFilesSummaryEl.textContent = "";
      renderStagingDiagnostics();
      return;
    }

    const isMulti = stagedFiles.length >= MULTI_IMAGE_MIN_FILES;
    const isSinglePdf = stagedFiles.length === 1 && isPdfFile(stagedFiles[0]);

    if (isMulti) {
      selectedFilesSummaryEl.hidden = false;
      selectedFilesSummaryEl.textContent =
        `${stagedFiles.length} / ${MULTI_IMAGE_MAX_FILES} עמודים — סדר לפי סדר ההוספה`;
    } else if (!isSinglePdf) {
      selectedFilesSummaryEl.hidden = false;
      selectedFilesSummaryEl.textContent = "עמוד 1 — ניתן להוסיף עמודים נוספים לפני ההעלאה";
    } else {
      selectedFilesSummaryEl.hidden = true;
      selectedFilesSummaryEl.textContent = "";
    }

    stagedFiles.forEach((f, i) => {
      const li = document.createElement("li");
      li.className = "selected-files-item";

      const main = document.createElement("div");
      main.className = "selected-files-main";

      const label = document.createElement("span");
      label.className = "selected-files-label";
      if (isSinglePdf) {
        label.textContent = `קובץ: ${f.name || "PDF"}`;
      } else {
        label.textContent = `עמוד ${i + 1}`;
      }

      if (isImageFile(f)) {
        const thumb = document.createElement("img");
        thumb.className = "selected-files-thumb";
        thumb.src = getPreviewUrl(f);
        thumb.alt = `תצוגה מקדימה של עמוד ${i + 1}`;
        thumb.loading = "lazy";
        thumb.decoding = "async";
        main.appendChild(thumb);
      }

      main.appendChild(label);

      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "btn btn-link selected-files-remove";
      removeBtn.textContent = "הסרה";
      removeBtn.setAttribute("aria-label", isSinglePdf ? "הסרת הקובץ" : `הסרת עמוד ${i + 1}`);
      removeBtn.addEventListener("click", () => removeStagedFile(i));

      li.appendChild(main);
      li.appendChild(removeBtn);
      selectedFilesEl.appendChild(li);
    });

    patchStagingDiagnostics({
      lastEvent: "renderSelectedFiles:done",
      stagedAfterRender: stagedFiles.length,
      renderEmptyBranch: false,
    });
  }

  applyFileInputMode();
  docTypeEl.addEventListener("change", () => applyFileInputMode());

  async function runSingleFileUpload(file, doc_type, meta) {
    setMessage("ok", "יוצרת מסמך…");

    const mime_type = file.type || "application/octet-stream";
    const createPayload = Object.assign({}, meta, {
      doc_type,
      original_name: file.name,
      mime_type,
      size_bytes: file.size
    });

    const created = await jsonFetch("/api/uploads/create/", {
      method: "POST",
      body: JSON.stringify(createPayload)
    });

    const documentId = created.document_id;
    const uploadUrl = created.upload_url;
    if (!documentId || !uploadUrl) {
      throw new Error("Create response missing document_id or upload_url");
    }

    setMessage("ok", `מעלה ל-S3… (מסמך #${documentId})`);

    const putRes = await fetch(uploadUrl, {
      method: "PUT",
      headers: {"Content-Type": mime_type},
      body: file
    });
    if (!putRes.ok) {
      const putText = await putRes.text().catch(() => "");
      throw new Error(`S3 PUT failed: HTTP ${putRes.status} ${putText}`);
    }

    setMessage("ok", "מסיימת העלאה…");

    await jsonFetch(`/api/uploads/${documentId}/complete/`, {
      method: "POST",
      body: JSON.stringify({ success: true, file_size: file.size, file_mime: mime_type })
    });

    setMessage("ok", "בוצע. מעבירה לעמוד המסמך…");
    window.location.href = `/api/ui/documents/${documentId}/`;
  }

  async function reportPartFailure(documentId, orderIndex, message) {
    // Best-effort: mark this part (and therefore the upload) FAILED on the backend.
    // V1 failed-part policy is terminal; there is no per-part retry/replace.
    try {
      await jsonFetch(`/api/uploads/${documentId}/parts/${orderIndex}/complete/`, {
        method: "POST",
        body: JSON.stringify({ success: false, error: message })
      });
    } catch (_) {
      // Already in a failure path; ignore secondary errors.
    }
  }

  async function runMultiImageUpload(files, meta) {
    if (files.length > MULTI_IMAGE_MAX_FILES) {
      throw new Error(`ניתן להעלות עד ${MULTI_IMAGE_MAX_FILES} תמונות במסמך אחד.`);
    }
    if (files.some((f) => !isImageFile(f))) {
      throw new Error("בהעלאת ריבוי קבצים יש לבחור תמונות בלבד. PDF יש להעלות כקובץ יחיד.");
    }

    setMessage("ok", "יוצרת מסמך…");

    const createPayload = Object.assign({}, meta, {
      doc_type: "IMAGE",
      files: files.map((f) => ({
        original_name: f.name,
        mime_type: f.type || "image/*",
        size_bytes: f.size
      }))
    });

    const created = await jsonFetch("/api/uploads/create/", {
      method: "POST",
      body: JSON.stringify(createPayload)
    });

    const documentId = created.document_id;
    const uploads = Array.isArray(created.uploads) ? created.uploads : null;
    if (!documentId || !uploads || uploads.length !== files.length) {
      throw new Error("Create response missing document_id or uploads[]");
    }

    const total = files.length;
    const restartMsg = "ההעלאה מרובת־התמונות נכשלה ויש להתחיל העלאה חדשה (אין ניסיון חוזר לעמוד בודד בגרסה זו).";

    for (let i = 0; i < uploads.length; i++) {
      const entry = uploads[i];
      const orderIndex = entry.order_index;
      const file = files[orderIndex];
      const mime_type = file.type || entry.mime_type || "image/*";

      setMessage("ok", `מעלה עמוד ${orderIndex + 1} מתוך ${total}…`);

      let putRes;
      try {
        putRes = await fetch(entry.upload_url, {
          method: "PUT",
          headers: {"Content-Type": mime_type},
          body: file
        });
      } catch (netErr) {
        await reportPartFailure(documentId, orderIndex, `network error: ${netErr}`);
        throw new Error(`העלאת עמוד ${orderIndex + 1} נכשלה. ${restartMsg}`);
      }
      if (!putRes.ok) {
        const putText = await putRes.text().catch(() => "");
        await reportPartFailure(documentId, orderIndex, `S3 PUT failed: HTTP ${putRes.status} ${putText}`);
        throw new Error(`העלאת עמוד ${orderIndex + 1} נכשלה. ${restartMsg}`);
      }

      setMessage("ok", `מאשרת עמוד ${orderIndex + 1} מתוך ${total}…`);
      try {
        await jsonFetch(`/api/uploads/${documentId}/parts/${orderIndex}/complete/`, {
          method: "POST",
          body: JSON.stringify({ success: true, file_size: file.size, file_mime: mime_type })
        });
      } catch (completeErr) {
        await reportPartFailure(documentId, orderIndex, `part complete failed: ${completeErr && completeErr.message ? completeErr.message : completeErr}`);
        throw new Error(`אישור עמוד ${orderIndex + 1} נכשל. ${restartMsg}`);
      }
    }

    setMessage("ok", "מסיימת מסמך…");
    await jsonFetch(`/api/uploads/${documentId}/finalize/`, {
      method: "POST",
      body: JSON.stringify({ success: true })
    });

    setMessage("ok", "בוצע. מעבירה לעמוד המסמך…");
    window.location.href = `/api/ui/documents/${documentId}/`;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    setMessage("", "");

    const files = getStagedFiles();
    if (files.length === 0) {
      setMessage("error", "חובה לבחור קובץ.");
      return;
    }

    const isMulti = files.length >= MULTI_IMAGE_MIN_FILES;

    const title = document.getElementById("title").value.trim();
    const doc_type = docTypeEl.value;

    const date_start = document.getElementById("date_start").value || null;
    const date_end = document.getElementById("date_end").value || null;
    const date_precision = document.getElementById("date_precision").value || "UNKNOWN";
    const language = document.getElementById("language").value || "";
    const text_input_type = document.getElementById("text_input_type").value || "";
    const visibility = document.getElementById("visibility").value || "private";
    const author_name = document.getElementById("author_name").value.trim();
    const source_title = document.getElementById("source_title").value.trim();
    const publicNoteEl = document.getElementById("public_note");
    const public_note = publicNoteEl ? publicNoteEl.value : "";

    const categoriesRaw = document.getElementById("categories").value;
    const eventsRaw = document.getElementById("events").value;
    const discoveryTagsRaw = document.getElementById("discovery_tags").value;

    function readSelectedIds(selectId) {
      const el = document.getElementById(selectId);
      if (!el) return [];
      return Array.from(el.selectedOptions)
        .map((option) => parseInt(option.value, 10))
        .filter((id) => !Number.isNaN(id));
    }

    const selected_categories = readSelectedIds("selected_categories");
    const selected_events = readSelectedIds("selected_events");
    const selected_tags = readSelectedIds("selected_tags");

    const donor = document.getElementById("donor").value.trim();
    const collection = document.getElementById("collection").value.trim();
    const original_location = document.getElementById("original_location").value.trim();
    const notes = document.getElementById("notes").value.trim();

    // Multi-image forces doc_type=IMAGE, so doc_type is only required for single-file.
    if (!title || !text_input_type || (!isMulti && !doc_type)) {
      setMessage("error", "נא למלא שדות חובה: כותרת + סוג מסמך + סוג טקסט.");
      return;
    }

    const categories = parseTags(categoriesRaw);
    const events = parseTags(eventsRaw);
    const discovery_tags = parseTags(discoveryTagsRaw);
    const admin_meta = { donor, collection, original_location, notes };

    const meta = { title, text_input_type, visibility, admin_meta, date_precision };
    if (date_start) meta.date_start = date_start;
    if (date_end) meta.date_end = date_end;
    if (language) meta.language = language;
    if (author_name) meta.author_name = author_name;
    if (source_title) meta.source_title = source_title;
    if (public_note) meta.public_note = public_note;
    if (selected_categories.length) meta.selected_categories = selected_categories;
    if (selected_events.length) meta.selected_events = selected_events;
    if (selected_tags.length) meta.selected_tags = selected_tags;
    if (categories.length) meta.categories = categories;
    if (events.length) meta.events = events;
    if (discovery_tags.length) meta.discovery_tags = discovery_tags;

    submitBtn.disabled = true;

    try {
      if (isMulti) {
        await runMultiImageUpload(files, meta);
      } else {
        await runSingleFileUpload(files[0], doc_type, meta);
      }
    } catch (err) {
      setMessage("error", String(err && err.message ? err.message : err));
      submitBtn.disabled = false;
    }
  });

  function onFileInputChange(inputEl) {
    const selectedFiles = Array.from(inputEl.files || []);
    patchStagingDiagnostics({
      sourceInputId: inputEl && inputEl.id ? inputEl.id : "-",
      selectedFilesLen: selectedFiles.length,
      lastEvent: "fileInputChange",
      appendReject: null,
    });
    appendStagedFiles(selectedFiles, inputEl);
  }

  fileEl.addEventListener("change", () => onFileInputChange(fileEl));
  cameraFileEl.addEventListener("change", () => onFileInputChange(cameraFileEl));
</script>
