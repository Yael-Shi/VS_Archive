{# Single source of truth for presigned S3 upload JS. Include once per page that hosts #uploadForm. #}
<script>
  const MULTI_IMAGE_MIN_FILES = 2;
  const MULTI_IMAGE_MAX_FILES = 35;
  const INCREMENTAL_MIN_PAGES = 1;

  const PAGE_STATUS = {
    UPLOADING: "uploading",
    UPLOADED: "uploaded",
    FAILED: "failed",
  };

  const form = document.getElementById("uploadForm");
  const msgEl = document.getElementById("msg");
  const submitBtn = document.getElementById("submitBtn");

  const fileEl = document.getElementById("file");
  const galleryAddPageLabel = document.getElementById("galleryAddPageLabel");
  const desktopFilePickLabel = document.getElementById("desktopFilePickLabel");
  const galleryMultiSelectOrderHint = document.getElementById("galleryMultiSelectOrderHint");
  const docTypeEl = document.getElementById("doc_type");
  const languageEl = document.getElementById("language");
  const textInputTypeEl = document.getElementById("text_input_type");
  const handwritingTypeFieldEl = document.getElementById("handwritingTypeField");
  const handwritingTypeEl = document.getElementById("handwriting_type");
  const selectedFilesEl = document.getElementById("selectedFiles");
  const selectedFilesSummaryEl = document.getElementById("selectedFilesSummary");

  /** PDF-only staging; gallery images use incremental upload (no File retention). */
  let stagedFiles = [];

  /** Incremental image-upload state (metadata + page status only; no retained File objects). */
  let incrementalDocumentId = null;
  let incrementalPages = [];
  let addSeqCounter = 0;
  let incrementalUploadInProgress = false;

  function setMessage(kind, text) {
    msgEl.className = "msg";
    if (kind === "error") msgEl.classList.add("msg-error");
    else if (kind === "ok") msgEl.classList.add("msg-ok");
    msgEl.textContent = text || "";
  }

  function parseTags(raw) {
    return (raw || "")
      .split(",")
      .map(s => s.trim())
      .filter(Boolean);
  }

  function isHebrewHandwrittenSelection() {
    if (!handwritingTypeFieldEl) return false;

    return (
      languageEl.value === handwritingTypeFieldEl.dataset.hebrewLanguage &&
      textInputTypeEl.value ===
        handwritingTypeFieldEl.dataset.handwrittenTextInputType
    );
  }

  function updateHandwritingTypeField() {
    const relevant = isHebrewHandwrittenSelection();
    handwritingTypeFieldEl.hidden = !relevant;
    handwritingTypeEl.disabled = !relevant;
  }

  function getCsrfToken() {
    const input = document.querySelector("#uploadForm input[name=csrfmiddlewaretoken]");
    if (input && input.value) {
      return input.value;
    }
    const name = "csrftoken";
    if (!document.cookie) return "";
    for (const part of document.cookie.split(";")) {
      const cookie = part.trim();
      if (cookie.startsWith(name + "=")) {
        return decodeURIComponent(cookie.substring(name.length + 1));
      }
    }
    return "";
  }

  async function jsonFetch(url, options) {
    const headers = Object.assign(
      {"Content-Type": "application/json", "X-CSRFToken": getCsrfToken()},
      (options && options.headers) || {}
    );
    const res = await fetch(url, Object.assign({}, options || {}, {headers}));
    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch (_) {}
    if (!res.ok) {
      const err = (data && (data.error || data.detail)) ? (data.error || data.detail) : text;
      throw new Error(`HTTP ${res.status}: ${err}`);
    }
    return data;
  }

  function isImageFile(f) {
    return (f.type || "").toLowerCase().startsWith("image/");
  }

  function isPdfFile(f) {
    const mt = (f.type || "").toLowerCase();
    return mt === "application/pdf" || (f.name || "").toLowerCase().endsWith(".pdf");
  }

  function getStagedFiles() {
    return stagedFiles.slice();
  }

  function isIncrementalBusy() {
    return incrementalUploadInProgress;
  }

  function resetIncrementalState() {
    incrementalDocumentId = null;
    incrementalPages = [];
    addSeqCounter = 0;
    incrementalUploadInProgress = false;
    if (galleryMultiSelectOrderHint) {
      galleryMultiSelectOrderHint.hidden = true;
    }
    renderPageList();
    updateDocTypeFromSelection();
    updateGalleryPickState();
    updateSubmitButtonState();
  }

  function isIncrementalImageMode() {
    return incrementalDocumentId !== null || incrementalPages.length > 0;
  }

  function countIncrementalUploadedPages() {
    return incrementalPages.filter((p) => p.status === PAGE_STATUS.UPLOADED).length;
  }

  function clearFileInputValue(inputEl) {
    if (!inputEl) return;
    inputEl.value = "";
  }

  function applyFileInputMode() {
    const dt = docTypeEl.value;

    if (dt === "IMAGE") {
      fileEl.setAttribute("accept", "image/*");
    } else if (dt === "PDF") {
      fileEl.setAttribute("accept", "application/pdf");
    } else {
      fileEl.setAttribute("accept", "application/pdf,image/*");
    }
  }

  function updateDocTypeFromSelection() {
    const incrementalCount = countIncrementalUploadedPages();
    if (incrementalCount >= MULTI_IMAGE_MIN_FILES) {
      docTypeEl.value = "IMAGE";
      applyFileInputMode();
      return;
    }

    if (incrementalCount === 1) {
      docTypeEl.value = "IMAGE";
      applyFileInputMode();
      return;
    }

    const f = stagedFiles[0];
    if (!f) {
      if (incrementalPages.length > 0) {
        docTypeEl.value = "IMAGE";
      }
      applyFileInputMode();
      return;
    }

    if (isPdfFile(f)) {
      docTypeEl.value = "PDF";
    } else if (isImageFile(f)) {
      docTypeEl.value = "IMAGE";
    }
    applyFileInputMode();
  }

  function updateGalleryPickState() {
    const disablePick =
      isIncrementalBusy() || countIncrementalUploadedPages() >= MULTI_IMAGE_MAX_FILES;
    fileEl.disabled = disablePick;
    if (galleryAddPageLabel) {
      galleryAddPageLabel.classList.toggle("is-disabled", disablePick);
      galleryAddPageLabel.setAttribute("aria-disabled", disablePick ? "true" : "false");
    }
    if (desktopFilePickLabel) {
      desktopFilePickLabel.classList.toggle("is-disabled", disablePick);
      desktopFilePickLabel.setAttribute("aria-disabled", disablePick ? "true" : "false");
    }
  }

  function updateSubmitButtonState() {
    if (isIncrementalImageMode()) {
      const uploaded = countIncrementalUploadedPages();
      submitBtn.disabled = uploaded < INCREMENTAL_MIN_PAGES || isIncrementalBusy();
      return;
    }
    submitBtn.disabled = false;
  }

  function incrementalPageStatusLabel(page) {
    if (page.status === PAGE_STATUS.UPLOADING) return "מעלה…";
    if (page.status === PAGE_STATUS.UPLOADED) return "הועלה";
    if (page.status === PAGE_STATUS.FAILED) return "נכשל";
    return "";
  }

  function incrementalPageDisplayNum(page, listIndex) {
    if (page.orderIndex >= 0) return page.orderIndex + 1;
    if (page.addSeq > 0) return page.addSeq;
    return listIndex + 1;
  }

  function removeStagedFile(index) {
    if (index < 0 || index >= stagedFiles.length) return;
    stagedFiles.splice(index, 1);
    setMessage("", "");
    updateDocTypeFromSelection();
    renderPageList();
    updateSubmitButtonState();
  }

  function appendStagedPdfFile(file, sourceInputEl) {
    if (isIncrementalImageMode()) {
      setMessage(
        "error",
        "כבר התחלתם הוספת עמודי תמונה. לא ניתן לערבב עם PDF. רעננו את הדף להתחלה חדשה."
      );
      clearFileInputValue(sourceInputEl);
      return;
    }

    if (stagedFiles.length > 0) {
      setMessage("error", "PDF כבר נבחר. יש להסיר אותו לפני הוספת קבצים נוספים.");
      clearFileInputValue(sourceInputEl);
      return;
    }

    if (!isPdfFile(file)) {
      setMessage("error", "PDF יש להעלות כקובץ יחיד.");
      clearFileInputValue(sourceInputEl);
      return;
    }

    stagedFiles.push(file);
    setMessage("", "");
    updateDocTypeFromSelection();
    renderPageList();
    updateSubmitButtonState();
    clearFileInputValue(sourceInputEl);
  }

  function renderPageList() {
    selectedFilesEl.innerHTML = "";

    const stagedCount = stagedFiles.length;
    const incrementalCount = incrementalPages.length;
    const uploadedIncremental = countIncrementalUploadedPages();

    if (stagedCount === 0 && incrementalCount === 0) {
      selectedFilesSummaryEl.hidden = true;
      selectedFilesSummaryEl.textContent = "";
      return;
    }

    if (incrementalCount > 0) {
      selectedFilesSummaryEl.hidden = false;
      let summary =
        `${uploadedIncremental} / ${MULTI_IMAGE_MAX_FILES} עמודים הועלו — סדר לפי סדר ההוספה`;
      if (uploadedIncremental >= INCREMENTAL_MIN_PAGES) {
        summary += " (ניתן להוסיף עמודים או לסיים את המסמך)";
      } else {
        summary += " (המתיני להעלאת עמוד ראשון לפני סיום)";
      }
      selectedFilesSummaryEl.textContent = summary;
    } else if (stagedCount === 1 && isPdfFile(stagedFiles[0])) {
      selectedFilesSummaryEl.hidden = true;
      selectedFilesSummaryEl.textContent = "";
    } else {
      selectedFilesSummaryEl.hidden = true;
      selectedFilesSummaryEl.textContent = "";
    }

    incrementalPages.forEach((page, i) => {
      const li = document.createElement("li");
      li.className = "selected-files-item";

      const main = document.createElement("div");
      main.className = "selected-files-main";

      const label = document.createElement("span");
      label.className = "selected-files-label";
      const displayNum = incrementalPageDisplayNum(page, i);
      const namePart = page.label ? ` — ${page.label}` : "";
      label.textContent =
        `עמוד ${displayNum}${namePart} — ${incrementalPageStatusLabel(page)}`;

      main.appendChild(label);
      li.appendChild(main);
      selectedFilesEl.appendChild(li);
    });

    stagedFiles.forEach((f) => {
      const li = document.createElement("li");
      li.className = "selected-files-item";

      const main = document.createElement("div");
      main.className = "selected-files-main";

      const label = document.createElement("span");
      label.className = "selected-files-label";
      label.textContent = `קובץ: ${f.name || "PDF"}`;

      main.appendChild(label);

      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "btn btn-link selected-files-remove";
      removeBtn.textContent = "הסרה";
      removeBtn.setAttribute("aria-label", "הסרת הקובץ");
      removeBtn.addEventListener("click", () => removeStagedFile(0));

      li.appendChild(main);
      li.appendChild(removeBtn);
      selectedFilesEl.appendChild(li);
    });
  }

  function readSelectedIds(selectId) {
    const el = document.getElementById(selectId);
    if (!el) return [];
    return Array.from(el.selectedOptions)
      .map((option) => parseInt(option.value, 10))
      .filter((id) => !Number.isNaN(id));
  }

  function buildFormMeta() {
    const title = document.getElementById("title").value.trim();
    const language = languageEl.value || "";
    const text_input_type = textInputTypeEl.value || "";
    const visibility = document.getElementById("visibility").value || "private";
    const source_title = document.getElementById("source_title").value.trim();
    const publicNoteEl = document.getElementById("public_note");
    const public_note = publicNoteEl ? publicNoteEl.value : "";

    const categoriesRaw = document.getElementById("categories").value;
    const eventsRaw = document.getElementById("events").value;
    const discoveryTagsRaw = document.getElementById("discovery_tags").value;

    const selected_categories = readSelectedIds("selected_categories");
    const selected_events = readSelectedIds("selected_events");
    const selected_tags = readSelectedIds("selected_tags");

    const donor = document.getElementById("donor").value.trim();
    const collection = document.getElementById("collection").value.trim();
    const original_location = document.getElementById("original_location").value.trim();
    const notes = document.getElementById("notes").value.trim();

    const categories = parseTags(categoriesRaw);
    const events = parseTags(eventsRaw);
    const discovery_tags = parseTags(discoveryTagsRaw);
    const admin_meta = { donor, collection, original_location, notes };

    const meta = { title, text_input_type, visibility, admin_meta };
    if (window.vsArchiveDateEntry && window.vsArchiveDateEntry.collectMeta) {
      window.vsArchiveDateEntry.collectMeta(meta);
    }
    if (language) meta.language = language;
    if (isHebrewHandwrittenSelection()) {
      meta.handwriting_type = handwritingTypeEl.value;
    }
    if (source_title) meta.source_title = source_title;
    if (public_note) meta.public_note = public_note;
    if (selected_categories.length) meta.selected_categories = selected_categories;
    if (selected_events.length) meta.selected_events = selected_events;
    if (selected_tags.length) meta.selected_tags = selected_tags;
    if (categories.length) meta.categories = categories;
    if (events.length) meta.events = events;
    if (discovery_tags.length) meta.discovery_tags = discovery_tags;
    meta.archive_item_person_ids = readSelectedIds("archive_item_person_ids");
    const newPersonNameEl = document.getElementById("new_archive_item_person_name");
    const new_archive_item_person_name = newPersonNameEl
      ? (newPersonNameEl.value || "").trim()
      : "";
    if (new_archive_item_person_name) {
      meta.new_archive_item_person_name = new_archive_item_person_name;
    }
    meta.author_ids = readSelectedIds("author_ids");
    const newAuthorNameEl = document.getElementById("new_author_name");
    const new_author_name = newAuthorNameEl
      ? (newAuthorNameEl.value || "").trim()
      : "";
    if (new_author_name) {
      meta.new_author_name = new_author_name;
    }
    return meta;
  }

  function validateMetaForDraftCreate() {
    const title = document.getElementById("title").value.trim();
    const text_input_type = document.getElementById("text_input_type").value || "";
    if (!title || !text_input_type) {
      return "נא למלא לפחות כותרת וסוג טקסט לפני הוספת עמודים.";
    }
    return null;
  }

  applyFileInputMode();
  updateHandwritingTypeField();
  docTypeEl.addEventListener("change", () => applyFileInputMode());
  languageEl.addEventListener("change", updateHandwritingTypeField);
  textInputTypeEl.addEventListener("change", updateHandwritingTypeField);
  updateGalleryPickState();
  updateSubmitButtonState();

  async function runSingleFileUpload(file, doc_type, meta) {
    setMessage("ok", "יוצרת מסמך…");

    const mime_type = file.type || "application/octet-stream";
    const createPayload = Object.assign({}, meta, {
      doc_type,
      original_name: file.name,
      mime_type,
      size_bytes: file.size
    });

    const created = await jsonFetch("/api/uploads/create/", {
      method: "POST",
      body: JSON.stringify(createPayload)
    });

    const documentId = created.document_id;
    const uploadUrl = created.upload_url;
    if (!documentId || !uploadUrl) {
      throw new Error("Create response missing document_id or upload_url");
    }

    setMessage("ok", `מעלה ל-S3… (מסמך #${documentId})`);

    const putRes = await fetch(uploadUrl, {
      method: "PUT",
      headers: {"Content-Type": mime_type},
      body: file
    });
    if (!putRes.ok) {
      const putText = await putRes.text().catch(() => "");
      throw new Error(`S3 PUT failed: HTTP ${putRes.status} ${putText}`);
    }

    setMessage("ok", "מסיימת העלאה…");

    await jsonFetch(`/api/uploads/${documentId}/complete/`, {
      method: "POST",
      body: JSON.stringify({ success: true, file_size: file.size, file_mime: mime_type })
    });

    setMessage("ok", "בוצע. מעבירה לעמוד המסמך…");
    window.location.href = `/api/ui/documents/${documentId}/`;
  }

  async function reportPartFailure(documentId, orderIndex, message) {
    try {
      await jsonFetch(`/api/uploads/${documentId}/parts/${orderIndex}/complete/`, {
        method: "POST",
        body: JSON.stringify({ success: false, error: message })
      });
    } catch (_) {
      // Already in a failure path; ignore secondary errors.
    }
  }

  async function ensureIncrementalDraft(meta) {
    if (incrementalDocumentId) {
      return incrementalDocumentId;
    }
    const created = await jsonFetch("/api/uploads/create/", {
      method: "POST",
      body: JSON.stringify(Object.assign({}, meta, { incremental: true, doc_type: "IMAGE" }))
    });
    if (!created.document_id) {
      throw new Error("Create response missing document_id");
    }
    incrementalDocumentId = created.document_id;
    return incrementalDocumentId;
  }

  async function uploadIncrementalPageFile(pageEntry, file) {
    incrementalUploadInProgress = true;
    pageEntry.status = PAGE_STATUS.UPLOADING;
    pageEntry.label = file.name || "";
    renderPageList();
    updateGalleryPickState();
    updateSubmitButtonState();

    const displayNum = incrementalPageDisplayNum(
      pageEntry,
      incrementalPages.indexOf(pageEntry)
    );
    setMessage("ok", `מעלה עמוד ${displayNum}…`);

    let documentId = null;
    let orderIndex = null;

    try {
      const metaErr = validateMetaForDraftCreate();
      if (metaErr) {
        throw new Error(metaErr);
      }

      if (!isImageFile(file)) {
        throw new Error("העלאת עמודים תומכת בתמונות בלבד.");
      }

      const uploadedCount = countIncrementalUploadedPages();
      if (uploadedCount >= MULTI_IMAGE_MAX_FILES) {
        throw new Error(`ניתן להעלות עד ${MULTI_IMAGE_MAX_FILES} תמונות במסמך אחד.`);
      }

      const meta = buildFormMeta();
      documentId = await ensureIncrementalDraft(meta);

      const mime_type = file.type || "image/jpeg";
      const addResp = await jsonFetch(`/api/uploads/${documentId}/parts/add/`, {
        method: "POST",
        body: JSON.stringify({
          original_name: file.name || "page.jpg",
          mime_type,
          size_bytes: file.size,
        }),
      });

      orderIndex = addResp.order_index;
      pageEntry.orderIndex = orderIndex;
      pageEntry.label = addResp.original_name || pageEntry.label;
      renderPageList();

      const uploadUrl = addResp.upload_url;
      if (uploadUrl == null || uploadUrl === "") {
        throw new Error("parts/add response missing upload_url");
      }

      let putRes;
      try {
        putRes = await fetch(uploadUrl, {
          method: "PUT",
          headers: {"Content-Type": mime_type},
          body: file,
        });
      } catch (netErr) {
        await reportPartFailure(documentId, orderIndex, `network error: ${netErr}`);
        throw new Error(`העלאת עמוד ${orderIndex + 1} נכשלה.`);
      }

      if (!putRes.ok) {
        const putText = await putRes.text().catch(() => "");
        await reportPartFailure(
          documentId,
          orderIndex,
          `S3 PUT failed: HTTP ${putRes.status} ${putText}`
        );
        throw new Error(`העלאת עמוד ${orderIndex + 1} נכשלה.`);
      }

      await jsonFetch(`/api/uploads/${documentId}/parts/${orderIndex}/complete/`, {
        method: "POST",
        body: JSON.stringify({
          success: true,
          file_size: file.size,
          file_mime: mime_type,
        }),
      });

      pageEntry.status = PAGE_STATUS.UPLOADED;
      setMessage("ok", `עמוד ${orderIndex + 1} הועלה.`);
    } catch (err) {
      pageEntry.status = PAGE_STATUS.FAILED;
      const errText = String(err && err.message ? err.message : err);
      setMessage("error", `${errText} ניתן להוסיף עמוד נוסף או לרענן את הדף.`);
    } finally {
      incrementalUploadInProgress = false;
      renderPageList();
      updateDocTypeFromSelection();
      updateGalleryPickState();
      updateSubmitButtonState();
    }
  }

  async function processGalleryImagesIncrementally(selectedFiles, sourceInputEl) {
    const incoming = Array.isArray(selectedFiles)
      ? selectedFiles.slice()
      : Array.from(selectedFiles || []);

    if (incoming.length === 0) {
      setMessage("error", "לא התקבל קובץ. נסי לבחור שוב מהגלריה.");
      clearFileInputValue(sourceInputEl);
      return;
    }

    if (stagedFiles.length > 0) {
      setMessage(
        "error",
        "כבר נבחר PDF. לא ניתן לערבב עם תמונות. רעננו את הדף להתחלה חדשה."
      );
      clearFileInputValue(sourceInputEl);
      return;
    }

    const unsupported = incoming.filter((f) => !isImageFile(f));
    if (unsupported.length > 0) {
      setMessage("error", "ניתן להעלות תמונות או PDF בלבד.");
      clearFileInputValue(sourceInputEl);
      return;
    }

    const metaErr = validateMetaForDraftCreate();
    if (metaErr) {
      setMessage("error", metaErr);
      clearFileInputValue(sourceInputEl);
      return;
    }

    if (isIncrementalBusy()) {
      setMessage("ok", "ממתינה לסיום העלאת העמוד הקודם…");
      clearFileInputValue(sourceInputEl);
      return;
    }

    const uploadedBefore = countIncrementalUploadedPages();
    const totalAfter = uploadedBefore + incoming.length;
    if (totalAfter > MULTI_IMAGE_MAX_FILES) {
      setMessage(
        "error",
        `ניתן להעלות עד ${MULTI_IMAGE_MAX_FILES} תמונות במסמך אחד (כרגע ${uploadedBefore}).`
      );
      clearFileInputValue(sourceInputEl);
      return;
    }

    if (galleryMultiSelectOrderHint) {
      galleryMultiSelectOrderHint.hidden = incoming.length <= 1;
    }

    if (incoming.length > 1) {
      setMessage(
        "ok",
        "מעלה את התמונות לפי סדר הבחירה — ודאו שהסדר ברשימה נכון לפני הסיום."
      );
    }

    clearFileInputValue(sourceInputEl);

    for (const file of incoming) {
      if (isIncrementalBusy()) {
        setMessage("ok", "ממתינה לסיום העלאת העמוד הקודם…");
        return;
      }

      addSeqCounter += 1;
      const pageEntry = {
        addSeq: addSeqCounter,
        orderIndex: -1,
        label: file.name || "",
        status: PAGE_STATUS.UPLOADING,
      };
      incrementalPages.push(pageEntry);
      renderPageList();
      updateDocTypeFromSelection();
      updateGalleryPickState();
      updateSubmitButtonState();

      await uploadIncrementalPageFile(pageEntry, file);
    }
  }

  async function runIncrementalFinalize(documentId) {
    setMessage("ok", "מסיימת מסמך…");
    await jsonFetch(`/api/uploads/${documentId}/finalize/`, {
      method: "POST",
      body: JSON.stringify({ success: true }),
    });
    setMessage("ok", "בוצע. מעבירה לעמוד המסמך…");
    resetIncrementalState();
    window.location.href = `/api/ui/documents/${documentId}/`;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    setMessage("", "");

    if (isIncrementalImageMode()) {
      if (isIncrementalBusy()) {
        setMessage("ok", "ממתינה לסיום העלאת העמודים…");
        return;
      }
      const uploaded = countIncrementalUploadedPages();
      if (uploaded < INCREMENTAL_MIN_PAGES) {
        setMessage(
          "error",
          "נדרש לפחות עמוד אחד שהועלה לפני סיום."
        );
        return;
      }

      submitBtn.disabled = true;
      try {
        await runIncrementalFinalize(incrementalDocumentId);
      } catch (err) {
        setMessage("error", String(err && err.message ? err.message : err));
        updateSubmitButtonState();
      }
      return;
    }

    const files = getStagedFiles();
    if (files.length === 0) {
      setMessage("error", "חובה לבחור קובץ.");
      return;
    }

    const meta = buildFormMeta();
    const doc_type = docTypeEl.value;

    if (!meta.title || !meta.text_input_type || !doc_type) {
      setMessage("error", "נא למלא שדות חובה: כותרת + סוג מסמך + סוג טקסט.");
      return;
    }

    submitBtn.disabled = true;

    try {
      await runSingleFileUpload(files[0], doc_type, meta);
    } catch (err) {
      setMessage("error", String(err && err.message ? err.message : err));
      submitBtn.disabled = false;
    }
  });

  function onGalleryInputChange(inputEl) {
    const incoming = Array.from(inputEl.files || []);
    if (incoming.length === 0) {
      setMessage("error", "לא התקבל קובץ. נסי לבחור שוב מהגלריה.");
      clearFileInputValue(inputEl);
      return;
    }

    const hasPdf = incoming.some((f) => isPdfFile(f));
    const hasImage = incoming.some((f) => isImageFile(f));

    if (hasPdf && hasImage) {
      setMessage("error", "PDF יש להעלות כקובץ יחיד, בנפרד מתמונות.");
      clearFileInputValue(inputEl);
      return;
    }

    if (hasPdf) {
      if (incoming.length > 1) {
        setMessage("error", "PDF יש להעלות כקובץ יחיד.");
        clearFileInputValue(inputEl);
        return;
      }
      appendStagedPdfFile(incoming[0], inputEl);
      return;
    }

    void processGalleryImagesIncrementally(incoming, inputEl);
  }

  fileEl.addEventListener("change", () => onGalleryInputChange(fileEl));

  window.addEventListener("pageshow", (event) => {
    if (!event.persisted) return;
    stagedFiles = [];
    clearFileInputValue(fileEl);
    resetIncrementalState();
    setMessage("", "");
  });
</script>
